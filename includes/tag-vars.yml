variables:
  # Extract APP and ENV from deploy tags (format: deploy-app-env)
  TAG_REGEX: '/^deploy-(?<app>[a-z-]+)-(?<env>dev|staging|production)$/'
  
  # Script to set variables from tag
  SET_TAG_VARS: |
    if [[ "$CI_COMMIT_TAG" =~ $TAG_REGEX ]]; then
      echo "APP=${BASH_REMATCH[1]}" >> tag_vars.env
      echo "ENV=${BASH_REMATCH[2]}" >> tag_vars.env
      echo "Extracted APP=${BASH_REMATCH[1]}, ENV=${BASH_REMATCH[2]} from tag"
    fi