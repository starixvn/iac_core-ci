---
.notify_slack:
  stage: notify
  script:
    - echo "Debug SLACK_WEBHOOK_URL $SLACK_WEBHOOK_URL | SLACK_CHANNEL SLACK_CHANNEL "
    - |
      MESSAGE=":rocket: *[SUCCESS] Deployment Completed* 
        • *Project:* \`$CI_PROJECT_NAME\`
        • *Environment:* \`${ENV:-$VAULT_ENV}\`
        • *Module:* \`${MODULE}\`
        • *Branch/Tag:* \`${CI_COMMIT_REF_NAME}\`
        • *Pipeline:* <$CI_PIPELINE_URL|#$CI_PIPELINE_ID>
        • *Commit:* <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|${CI_COMMIT_SHORT_SHA}>
        • *Triggered by:* $GITLAB_USER_NAME"
        
        curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"$SLACK_CHANNEL\",
            \"username\": \"GitLab Deploy Bot\",
            \"icon_emoji\": \":gitlab:\",
            \"attachments\": [
              {
                \"color\": \"#36a64f\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"$MESSAGE\"
                    }
                  }
                ]
              }
            ]
          }" \
          $SLACK_WEBHOOK_URL
  when: on_success

.notify_slack_failure:
  stage: notify
  script:
    - echo "Debug SLACK_WEBHOOK_URL $SLACK_WEBHOOK_URL | SLACK_CHANNEL SLACK_CHANNEL "
    - |
      MESSAGE=":fire: *[FAILED] Deployment Error* 
        • *Project:* \`$CI_PROJECT_NAME\`
        • *Environment:* \`${ENV:-$VAULT_ENV}\`
        • *Module:* \`${MODULE}\`
        • *Branch/Tag:* \`${CI_COMMIT_REF_NAME}\`
        • *Failed Job:* <$CI_JOB_URL|$CI_JOB_NAME>
        • *Pipeline:* <$CI_PIPELINE_URL|#$CI_PIPELINE_ID>
        • *Commit:* <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|${CI_COMMIT_SHORT_SHA}>
        • *Triggered by:* $GITLAB_USER_NAME
        • *Error Details:* Check the failed job log for more information"
        
        curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"$SLACK_CHANNEL\",
            \"username\": \"GitLab Deploy Bot\",
            \"icon_emoji\": \":gitlab:\",
            \"attachments\": [
              {
                \"color\": \"#ff0000\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"$MESSAGE\"
                    }
                  }
                ]
              }
            ]
          }" \
          $SLACK_WEBHOOK_URL
  when: on_failure

.notify_slack_tag:
  stage: notify
  extends: .notify_slack
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always


.cleanup_tag:
  stage: cleanup
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "cleaning up tag ..."
    - |
      curl --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --request DELETE \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/repository/tags/${CI_COMMIT_TAG}"
    - echo "Successfully deleted tag ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
  allow_failure: true