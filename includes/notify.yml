# notify.yml
---
.notify_job_failure: &notify_job_failure
  stage: notify
  script:
    - |
      # Chỉ notify khi job chính fail (không chạy khi after_script fail)
      if [ "$CI_FAILED_JOB_SCRIPT" != "true" ]; then
        MESSAGE=":fire: *[FAILED] ${CI_JOB_NAME}* - ${APP:-NA}/${MODULE:-NA}
        • Environment: \`${ENV:-$VAULT_ENV:-NA}\`
        • Branch/Tag: \`${CI_COMMIT_REF_NAME}\`
        • Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}>
        • Failed Job: <${CI_JOB_URL}|${CI_JOB_NAME}>
        • Triggered by: ${GITLAB_USER_NAME:-Unknown}"
        
        curl -X POST -H 'Content-type: application/json' \
          --data "{
            \"channel\": \"$SLACK_CHANNEL\",
            \"username\": \"GitLab CI Alert\",
            \"icon_emoji\": \":warning:\",
            \"attachments\": [{
              \"color\": \"#ff0000\",
              \"text\": \"$MESSAGE\"
            }]
          }" \
          "$SLACK_WEBHOOK_URL"
      fi
  rules:
    - when: on_failure
  allow_failure: true
  variables:
    CI_FAILED_JOB_SCRIPT: "true" # Đánh dấu đây là script notify

.notify_deploy_success: &notify_deploy_success
  stage: notify
  script:
    - |
      MESSAGE=":rocket: *[DEPLOYED] ${APP}/${MODULE}*
      • Environment: \`${ENV:-$VAULT_ENV}\`
      • Branch/Tag: \`${CI_COMMIT_REF_NAME}\`
      • Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}>
      • Commit: <${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}|${CI_COMMIT_SHORT_SHA}>
      • Triggered by: ${GITLAB_USER_NAME}"
      
      curl -X POST -H 'Content-type: application/json' \
        --data "{
          \"channel\": \"$SLACK_CHANNEL\",
          \"username\": \"GitLab CI\",
          \"icon_emoji\": \":gitlab:\",
          \"attachments\": [{
            \"color\": \"#36a64f\",
            \"text\": \"$MESSAGE\"
          }]
        }" \
        "$SLACK_WEBHOOK_URL"
  rules:
    - if: '$CI_JOB_NAME =~ /deploy/ && $CI_JOB_STATUS == "success"'
############### TAG


.notify_pipeline_tag_success:
  <<: *notify_deploy_success
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+/'
      when: on_success
    
.notify_pipeline_tag_failure:
  <<: *notify_job_failure
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+/'
      when: on_failure

######## cleanup_tag
.cleanup_tag:
  stage: cleanup
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "cleaning up tag ..."
    - |
      curl --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --request DELETE \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/repository/tags/${CI_COMMIT_TAG}"
    - echo "Successfully deleted tag ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
  allow_failure: true