---
.notify_slack:
  stage: notify
  script:
    - |
      if [ "$CI_JOB_STATUS" == "success" ]; then
        MESSAGE=":white_check_mark: *Deployment SUCCESS* 
        *Project:* $CI_PROJECT_NAME
        *Environment:* ${ENV:-$VAULT_ENV}
        *Module:* ${MODULE}
        *Tag:* $CI_COMMIT_TAG
        *Pipeline:* [$CI_PIPELINE_ID]($CI_PIPELINE_URL)
        *Commit:* ${CI_COMMIT_SHORT_SHA}
        *Details:* [View Pipeline]($CI_PIPELINE_URL)"
        
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$MESSAGE\", \"username\":\"GitLab CI\", \"icon_emoji\":\":gitlab:\"}" \
          $SLACK_WEBHOOK_URL
      fi
  when: on_success

.notify_slack_failure:
  stage: notify
  script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        MESSAGE=":x: *Deployment FAILED* 
        *Project:* $CI_PROJECT_NAME
        *Environment:* ${ENV:-$VAULT_ENV}
        *Module:* ${MODULE}
        *Tag:* $CI_COMMIT_TAG
        *Pipeline:* [$CI_PIPELINE_ID]($CI_PIPELINE_URL)
        *Commit:* ${CI_COMMIT_SHORT_SHA}
        *Failed Job:* [$CI_JOB_NAME]($CI_JOB_URL)
        *Details:* [View Pipeline]($CI_PIPELINE_URL)"
        
        curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"$MESSAGE\", \"username\":\"GitLab CI\", \"icon_emoji\":\":gitlab:\"}" \
          $SLACK_WEBHOOK_URL
      fi
  when: on_failure

.notify_slack_tag:
  stage: notify
  extends: .notify_slack
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always


.cleanup_tag:
  stage: cleanup
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "cleaning up tag ..."
    - |
      curl --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --request DELETE \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/repository/tags/${CI_COMMIT_TAG}"
    - echo "Successfully deleted tag ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
  allow_failure: true