# notify.yml
---
.notify_base: &notify_base
  stage: notify
  rules:
    - when: never # Disable by default
  script:
    - | 
      echo "${APP}/${MODULE} -  $ENV"
    - |
      STATUS="$([ "$CI_JOB_STATUS" = "success" ] && echo "SUCCESS" || echo "FAILED")"
      COLOR="$([ "$STATUS" = "SUCCESS" ] && echo "#36a64f" || echo "#ff0000")"
      EMOJI="$([ "$STATUS" = "SUCCESS" ] && echo ":rocket:" || echo ":fire:")"
      
      MESSAGE="$EMOJI *[$STATUS] ${CI_JOB_NAME}* - ${APP}/${MODULE}
      • Environment: \`${ENV:-$VAULT_ENV}\`
      • Ref: \`${CI_COMMIT_REF_NAME}\`
      • Pipeline: <${CI_PIPELINE_URL}|#${CI_PIPELINE_ID}>
      • Triggered by: ${GITLAB_USER_NAME}
      $([ "$STATUS" = "FAILED" ] && echo "• Failed Job: <${CI_JOB_URL}|${CI_JOB_NAME}>")"
      
      curl -sS -X POST -H 'Content-type: application/json' \
        --data "{
          \"channel\": \"$SLACK_CHANNEL\",
          \"username\": \"GitLab CI/CD\",
          \"icon_emoji\": \":gitlab:\",
          \"attachments\": [{
            \"color\": \"$COLOR\",
            \"text\": \"$MESSAGE\",
            \"footer\": \"$(date -u +'%Y-%m-%d %H:%M:%S UTC')\"
          }]
        }" \
        "$SLACK_WEBHOOK_URL"

.notify_pipeline_success:
  <<: *notify_base
  rules:
    - when: on_success
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+/'
      when: on_success

.notify_pipeline_failure:
  <<: *notify_base
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_failure
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+/'
      when: on_failure

.notify_stage_failure:
  <<: *notify_base
  needs: []
  rules:
    - if: '$CI_JOB_STATUS == "failed"'
      when: always
  variables:
    CI_JOB_NAME: "$CI_JOB_STAGE Stage"
######## cleanup_tag
.cleanup_tag:
  stage: cleanup
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "cleaning up tag ..."
    - |
      curl --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --request DELETE \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/repository/tags/${CI_COMMIT_TAG}"
    - echo "Successfully deleted tag ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
  allow_failure: true