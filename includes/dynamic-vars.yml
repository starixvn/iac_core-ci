variables:
  DEPLOY_TAG_PATTERN: '/^deploy-(?<app>[a-z-]+)-(?<env>dev|staging|production)$/'
  DETECT_SCRIPT: |
    if [[ "$CI_COMMIT_TAG" =~ $DEPLOY_TAG_PATTERN ]]; then
      echo "${BASH_REMATCH[1]}"
    else
      if [[ -d "applications" ]]; then
        changed=$(git diff --name-only ${CI_COMMIT_BEFORE_SHA:-HEAD~1}..HEAD | grep -oE 'applications/([^/]+)/' | cut -d'/' -f2 | sort | uniq)
      elif [[ -d "argocd/apps" ]]; then
        changed=$(git diff --name-only ${CI_COMMIT_BEFORE_SHA:-HEAD~1}..HEAD | grep -oE 'argocd/apps/([^/]+)/' | cut -d'/' -f3 | sort | uniq)
      fi
      if [ -z "$changed" ]; then
        echo "No application changes detected"
        exit 0
      elif [ $(echo "$changed" | wc -l) -gt 1 ]; then
        echo "Multiple applications changed: $changed" >&2
        exit 1
      else
        echo "$changed"
      fi
    fi