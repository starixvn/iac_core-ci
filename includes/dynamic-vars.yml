variables:
  DEPLOY_TAG_PATTERN: '^deploy-[a-z-]+-(dev|staging|production)$'
  
  DETECT_APP_SCRIPT: |
    # Check if this is a deploy tag
    if echo "$CI_COMMIT_TAG" | grep -Eq "$DEPLOY_TAG_PATTERN"; then
      APP=$(echo "$CI_COMMIT_TAG" | cut -d'-' -f2)
      ENV=$(echo "$CI_COMMIT_TAG" | cut -d'-' -f3)
      echo "Detected APP from tag: $APP"
      echo "APP=$APP" >> app.env
      echo "ENV=$ENV" >> app.env
    else
      # For merge requests or branch pushes
      if [ -d "applications" ]; then
        # IaC repo - look for changes in applications directory
        changed=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep -E '^applications/([^/]+)/' | cut -d'/' -f2 | sort | uniq)
      elif [ -d "argocd/apps" ]; then
        # EaC repo - look for changes in argocd/apps directory
        changed=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep -E '^argocd/apps/([^/]+)/' | cut -d'/' -f3 | sort | uniq)
      fi
      
      if [ -z "$changed" ]; then
        echo "No application changes detected in paths: applications/ or argocd/apps/"
      else
        echo "Detected changed APP(s): $changed"
        # Take first app if multiple changed (or modify as needed)
        APP=$(echo "$changed" | head -n1)
        echo "APP=$APP" >> app.env
      fi
    fi