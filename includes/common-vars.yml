---
variables:
  # Terraform
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-lock-timeout=300s"
  TF_CLI_ARGS_apply: "-lock-timeout=300s"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_vault_role: vault_jwt_auth_backend-pipeline
  PLAN: plan.tfplan
  JSON_PLAN_FILE: tfplan.json
  TF_ROOT: "${CI_PROJECT_DIR}"
  TF_CLI_CONFIG_FILE: ${CI_PROJECT_DIR}/.terraformrc
  # Move these to GitLab CI/CD variables or Vault
  SLACK_WEBHOOK_URL: ${CI_SLACK_WEBHOOK_URL}
  SLACK_CHANNEL: ${CI_SLACK_CHANNEL}

cache:
  - key:
      files:
        - ${CI_PROJECT_DIR}/${APP}/${MODULE}/variable.d/${ORG}/${ENV}/variables.tfvars
    paths:
      - ${CI_PROJECT_DIR}/${APP}/${MODULE}/.terraform
    policy: pull-push
    when: always

  - key: ${CI_COMMIT_REF_SLUG}-${APP}-${MODULE}-${ORG}-${ENV}-terraform.lock.hcl
    paths:
      - ${CI_PROJECT_DIR}/${APP}/${MODULE}/.terraform.lock.hcl
    policy: pull-push
    when: always