---
variables:
  # Terraform
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-lock-timeout=300s"
  TF_CLI_ARGS_apply: "-lock-timeout=300s"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_vault_role: vault_jwt_auth_backend-pipeline

  GIT_CLEAN_TAG_IMAGE: "alpine/git:v2.36.3"
  GITLAB_API_URL: "https://gitlab.nexdev.net/api/v4"
  
  # Ansible
  ANSIBLE_FORCE_COLOR: "1"
  ANSIBLE_HOST_KEY_CHECKING: "false"
  ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s"
  
  # Kubernetes
  KUBECONFIG: "/tmp/kubeconfig"
  
  # ArgoCD
  ARGOCD_VERSION: "2.7.4"
  ARGOCD_SERVER: "argocd.yourdomain.com"
  ARGOCD_OPTS: "--grpc-web --insecure"
  
  # Defaults
  #ENVIRONMENT: "dev"
  #CLUSTER: "cluster1"