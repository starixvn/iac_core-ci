---
variables:
  # Terraform
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-lock-timeout=300s"
  TF_CLI_ARGS_apply: "-lock-timeout=300s"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_vault_role: vault_jwt_auth_backend-pipeline
  PLAN: plan.tfplan
  JSON_PLAN_FILE: tfplan.json
  TF_ROOT: "${CI_PROJECT_DIR}"
  TF_CLI_CONFIG_FILE: $CI_PROJECT_DIR/.terraformrc
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/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"
  SLACK_CHANNEL: "deploy-command-center"

cache:
  - key: ${TOOL}-$MODULE-$ORG-$ENV-terraform
    paths:
      - $CI_PROJECT_DIR/.terraform