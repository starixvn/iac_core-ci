.notify_slack:
  stage: notify
  script:
    - echo "Notifying team..."

.cleanup_tag:
  stage: cleanup
  image: alpine/git:v2.36.3
  before_script:
    - apk add --no-cache curl
  script:
    - |
      # Delete local tag
      git tag -d ${CI_COMMIT_TAG} || true
      
      # Delete remote tag
      git push origin :refs/tags/${CI_COMMIT_TAG} || true
      
      echo "Cleaned up tag ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
      when: always
  allow_failure: true