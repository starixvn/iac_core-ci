# File: templates/iac/terraform-pipeline.yml
.terraform:base:
  image:
    name: hashicorp/terraform:1.6.0
    entrypoint: [""]
  before_script:
    - terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_PREFIX}/terraform.tfstate"

validate:tf:
  extends: .terraform:base
  stage: validate
  script:
    - terraform validate
    - terraform fmt -check
  allow_failure: false

plan:tf:
  extends: .terraform:base
  stage: plan
  script:
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - tfplan

apply:tf:
  extends: .terraform:base
  stage: apply
  script:
    - terraform apply -input=false tfplan
  when: manual
  only:
    - main
  environment:
    name: $CI_ENVIRONMENT_NAME

outputs:tf:
  stage: outputs
  image: jq:latest
  script:
    - terraform output -json | jq 'with_entries(.value |= .value)' > outputs.json
  artifacts:
    reports:
      dotenv: outputs.json