# notify.yml
---
.notify_base: &notify_base
  stage: notify
  rules:
    - when: never # Disable by default
  script:
    - | 
      echo "${APP}/${MODULE} -  $ENV - $CI_JOB_STATUS"

.notify_pipeline_success:
  <<: *notify_base
  script:
    - |
      STATUS="$([ "$CI_JOB_STATUS" = "success" ] && echo "SUCCESS" || echo "FAILED")"
      COLOR="$([ "$STATUS" = "SUCCESS" ] && echo "#36a64f" || echo "#ff0000")"
      EMOJI="$([ "$STATUS" = "SUCCESS" ] && echo ":rocket:" || echo ":fire:")"
      FOOTER_DATE=$(date -d '+7 hours' +'%Y-%m-%d %H:%M:%S GMT+7' 2>/dev/null || date +'%Y-%m-%d %H:%M:%S UTC')

      MESSAGE="$EMOJI *[${ENV} - DEPLOYED] ${APP} - ${MODULE}*
      • *Environment:* \`${ENV:-$VAULT_ENV}\` | *Branch/Tag:* \`${CI_COMMIT_REF_NAME}\` | by $GITLAB_USER_NAME
      • *Pipeline:* <$CI_PIPELINE_URL|#$CI_PIPELINE_ID>
      • *Commit:* <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|${CI_COMMIT_SHORT_SHA}>"
      if [ "$STATUS" = "FAILED" ]; then
        MESSAGE="$MESSAGE
        • Failed Job: <${CI_JOB_URL}|${CI_JOB_NAME}>"
      fi
      curl -sS -X POST -H 'Content-type: application/json' \
      --data "{
          \"channel\": \"$SLACK_CHANNEL\",
          \"username\": \"GitLab CI/CD\",
          \"attachments\": [{
            \"color\": \"$COLOR\",
            \"text\": \"$MESSAGE\",
            \"footer\": \"$FOOTER_DATE\"
          }]
      }" \
      "$SLACK_WEBHOOK_URL"

  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+/'
      when: on_success
    - when: on_success

.notify_pipeline_failure:
  <<: *notify_base
  script:
    - |
      STATUS="$([ "$CI_JOB_STATUS" = "success" ] && echo "SUCCESS" || echo "FAILED")"
      COLOR="$([ "$STATUS" = "SUCCESS" ] && echo "#36a64f" || echo "#ff0000")"
      EMOJI="$([ "$STATUS" = "SUCCESS" ] && echo ":rocket:" || echo ":fire:")"
      FOOTER_DATE=$(date -d '+7 hours' +'%Y-%m-%d %H:%M:%S GMT+7' 2>/dev/null || date +'%Y-%m-%d %H:%M:%S UTC')
      if [ "$STATUS" = "FAILED" ]; then
        MESSAGE="$EMOJI *[FAILED] Pipeline Error ${CI_JOB_NAME}*
        • *Environment:* \`${ENV:-$VAULT_ENV}\` | *Branch/Tag:* \`${CI_COMMIT_REF_NAME}\` | by $GITLAB_USER_NAME
        • *Pipeline:* <$CI_PIPELINE_URL|#$CI_PIPELINE_ID>
        • *Commit:* <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|${CI_COMMIT_SHORT_SHA}>
        • Failed Job: <${CI_JOB_URL}|${CI_JOB_NAME}>"
        curl -sS -X POST -H 'Content-type: application/json' \
      --data "{
          \"channel\": \"$SLACK_CHANNEL\",
          \"username\": \"GitLab CI/CD\",
          \"attachments\": [{
            \"color\": \"$COLOR\",
            \"text\": \"$MESSAGE\",
            \"footer\": \"$FOOTER_DATE\"
          }]
      }" \
      "$SLACK_WEBHOOK_URL"
      else
        MESSAGE="[SUCCESS] ${CI_JOB_NAME}"
        echo "$MESSAGE"
      fi

  when: on_failure
  #allow_failure: true

############### TAG
.notify_pipeline_tag_success:
  <<: *notify_base
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+/'
      when: on_success
    
.notify_pipeline_tag_failure:
  <<: *notify_base
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+/'
      when: on_failure

######## cleanup_tag
.cleanup_tag:
  stage: cleanup
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "cleaning up tag ..."
    - |
      curl --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --request DELETE \
          "${GITLAB_API_URL}/projects/${CI_PROJECT_ID}/repository/tags/${CI_COMMIT_TAG}"
    - echo "Successfully deleted tag ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
  allow_failure: true