---
.notify_base: &notify_base
  stage: notify
  rules:
    - when: never
  script:
    - |
      echo "${APP}/${MODULE} -  $ENV - $CI_JOB_STATUS"
.notify_pipeline_success:
  <<: *notify_base
  script:
    - |
      STATUS="$([ "$CI_JOB_STATUS" = "success" ] && echo "SUCCESS" || echo "FAILED")"
      COLOR="$([ "$STATUS" = "SUCCESS" ] && echo "#36a64f" || echo "#ff0000")"
      EMOJI="$([ "$STATUS" = "SUCCESS" ] && echo ":rocket:" || echo ":fire:")"
      FOOTER_DATE=$(date -d '+7 hours' +'%Y-%m-%d %H:%M:%S GMT+7' 2>/dev/null || date +'%Y-%m-%d %H:%M:%S UTC')

      # Escape các ký tự đặc biệt trong message
      MESSAGE=$(echo -e "$EMOJI *[${ENV} - DEPLOYED] ${APP} - ${MODULE}*\n• *Environment:* \`${ENV:-$VAULT_ENV}\` | *Branch/Tag:* \`${CI_COMMIT_REF_NAME}\` | by $GITLAB_USER_NAME\n• *Pipeline:* <$CI_PIPELINE_URL|#$CI_PIPELINE_ID>\n• *Commit:* <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|${CI_COMMIT_SHORT_SHA}>")
      
      if [ "$STATUS" = "FAILED" ]; then
        MESSAGE="$MESSAGE\n• Failed Job: <${CI_JOB_URL}|${CI_JOB_NAME}>"
      fi

      # Escape JSON cho message
      MESSAGE=$(echo "$MESSAGE" | sed 's/"/\\"/g')

      # Tạo JSON payload và gửi request
      JSON_PAYLOAD="{\"channel\":\"$SLACK_CHANNEL\",\"username\":\"GitLab CI/CD\",\"attachments\":[{\"color\":\"$COLOR\",\"text\":\"$MESSAGE\",\"footer\":\"$FOOTER_DATE\"}]}"
      
      curl -sS -X POST \
        -H 'Content-type: application/json' \
        --data "$JSON_PAYLOAD" \
        "$SLACK_WEBHOOK_URL"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+/'
      when: on_success
    - when: on_success

.notify_pipeline_failure:
  <<: *notify_base
  script:
    - |
      STATUS="$([ "$CI_JOB_STATUS" = "success" ] && echo "SUCCESS" || echo "FAILED")"
      COLOR="$([ "$STATUS" = "SUCCESS" ] && echo "#36a64f" || echo "#ff0000")"
      EMOJI="$([ "$STATUS" = "SUCCESS" ] && echo ":rocket:" || echo ":fire:")"
      FOOTER_DATE=$(date -d '+7 hours' +'%Y-%m-%d %H:%M:%S GMT+7' 2>/dev/null || date +'%Y-%m-%d %H:%M:%S UTC')
      if [ "$STATUS" = "FAILED" ]; then
        MESSAGE="$EMOJI *[FAILED] Pipeline Error ${CI_JOB_NAME}*
        • *Environment:* \`${ENV:-$VAULT_ENV}\` | *Branch/Tag:* \`${CI_COMMIT_REF_NAME}\` | by $GITLAB_USER_NAME
        • *Pipeline:* <$CI_PIPELINE_URL|#$CI_PIPELINE_ID>
        • *Commit:* <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|${CI_COMMIT_SHORT_SHA}>
        • Failed Job: <${CI_JOB_URL}|${CI_JOB_NAME}>"
        curl -sS -X POST -H 'Content-type: application/json' \
        --data "{
          \"channel\": \"$SLACK_CHANNEL\",
          \"username\": \"GitLab CI/CD\",
          \"attachments\": [{
            \"color\": \"$COLOR\",
            \"text\": \"$MESSAGE\",
            \"footer\": \"$FOOTER_DATE\"
          }]
        }" \
        "$SLACK_WEBHOOK_URL"
      else
        MESSAGE="$EMOJI *[$STATUS] ${CI_JOB_NAME}*
        • *Environment:* \`${ENV:-$VAULT_ENV}\` | *Branch/Tag:* \`${CI_COMMIT_REF_NAME}\` | by $GITLAB_USER_NAME
        • *Pipeline:* <$CI_PIPELINE_URL|#$CI_PIPELINE_ID>
        • *Commit:* <$CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA|${CI_COMMIT_SHORT_SHA}>"
        echo $MESSAGE
      fi
  when: on_failure