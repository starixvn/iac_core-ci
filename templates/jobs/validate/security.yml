---
.terraform_security:
  stage: security
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "Scanning TF - Security ${APP} / ${MODULE} ..."
    # Kiểm tra các file Terraform
    - |
      cd ${APP}/${MODULE}
      if ! find . -name "*.tf" > /dev/null 2>&1; then
        echo "❌ No Terraform files found"
        exit 1
      fi
      for tf_file in $(find . -name "*.tf"); do
        # Kiểm tra hardcoded credentials
        echo "Checking hardcoded credentials $tf_file..."
        grep -E "(password|secret|token|key).*=.*['\"].*['\"]" "$tf_file" && {
          echo "❌ Found hardcoded credentials in $tf_file"
          exit 1
        }

        # Kiểm tra public resources
        echo "Checking public resources $tf_file..."
        grep -E "(public_access|public =|acl.*public)" "$tf_file" && {
          echo "⚠️ Warning: Found public access configuration in $tf_file"
        }

        # Kiểm tra encryption
        echo "Checking encryption $tf_file..."
        grep -E "(encrypt.*=.*false|encrypted.*=.*false)" "$tf_file" && {
          echo "❌ Found disabled encryption in $tf_file"
          exit 1
        }
      done

    # Kiểm tra các file tfvars
    - |
      for vars_file in $(find . -name "*.tfvars"); do
        echo "Checking sensitive data in variables file $vars_file..."
        # Kiểm tra sensitive data
        grep -E "(password|secret|token|key).*=.*[^\"]+\".*\"" "$vars_file" && {
          echo "❌ Found sensitive data in $vars_file"
          exit 1
        }
      done

    # Kiểm tra cấu hình backend
    - |
      for backend_file in $(find . -name "backend.conf"); do
        echo "Checking encryption & lock in backend config $backend_file..."
        # Kiểm tra encryption và lock
        grep "encrypt.*=.*false" "$backend_file" && {
          echo "❌ Backend encryption must be enabled"
          exit 1
        }
        grep "use_lockfile.*=.*false" "$backend_file" && {
          echo "⚠️ Warning: State locking is disabled"
        }
      done

    # Kiểm tra provider configuration
    - |
      echo "Checking version constraints in provider configurations..."
      grep -r "provider.*{" . && {
        # Kiểm tra version constraints
        if ! grep -r "version.*=.*\".*\"" .; then
          echo "⚠️ Warning: Provider version should be constrained"
        fi
      }
  allow_failure: true

.trivy_security:
  stage: security
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - |
      echo "Scanning with Trivy for ${APP}/${MODULE}..."
      wget --no-verbose https://gitlab.nexdev.net/NEXOPS/tools/trivy-scan/-/raw/main/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -O trivy.tar.gz
      tar -xzf trivy.tar.gz
      chmod +x ./trivy
      echo "Scanning IaC files for Terraform with Trivy for ${APP}/${MODULE}..."
      ./trivy config --severity HIGH,CRITICAL --format json ${APP}/${MODULE} 
      # Scan IaC files với Trivy
      ./trivy config \
        --format json \
        --output trivy-results.json \
        ${APP}/${MODULE}
    - echo "🔍 Checking DefectDojo product and engagement availability"
    # Validate critical environment variables
    - |
      for var in DEFECTDOJO_URL DEFECTDOJO_API_KEY CI_PROJECT_NAME DEFECTDOJO_DEPT; do
        if [ -z "${!var}" ]; then
          echo "❌ Error: $var is not set"; exit 1
        fi
      done
    # Check or create product type
    - |
      PRODUCT_TYPE_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
        "${DEFECTDOJO_URL}/api/v2/product_types/?name=${DEFECTDOJO_DEPT}")
      PRODUCT_TYPE_STATUS=$(echo "$PRODUCT_TYPE_RESPONSE" | tail -n1)
      PRODUCT_TYPE_BODY=$(echo "$PRODUCT_TYPE_RESPONSE" | sed '$d')
      echo "DEBUG: Product type response body: $PRODUCT_TYPE_BODY"
      if [ "$PRODUCT_TYPE_STATUS" -eq 200 ] && [ "$(echo "$PRODUCT_TYPE_BODY" | jq '.count')" -ge 1 ]; then
        PRODUCT_TYPE_ID=$(echo "$PRODUCT_TYPE_BODY" | jq -r '.results[0].id')
        echo "✅ Product type '${DEFECTDOJO_DEPT}' found with ID: ${PRODUCT_TYPE_ID}"
      else
        echo "📝 Product type '${DEFECTDOJO_DEPT}' not found, creating..."
        CREATE_PRODUCT_TYPE_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
          -H "Content-Type: application/json" \
          "${DEFECTDOJO_URL}/api/v2/product_types/" \
          -d "{\"name\": \"${DEFECTDOJO_DEPT}\", \"description\": \"Auto-created product type for ${DEFECTDOJO_DEPT}\"}")
        CREATE_PRODUCT_TYPE_STATUS=$(echo "$CREATE_PRODUCT_TYPE_RESPONSE" | tail -n1)
        CREATE_PRODUCT_TYPE_BODY=$(echo "$CREATE_PRODUCT_TYPE_RESPONSE" | sed '$d')
        echo "DEBUG: Create product type response body: $CREATE_PRODUCT_TYPE_BODY"
        if [ "$CREATE_PRODUCT_TYPE_STATUS" -eq 201 ]; then
          PRODUCT_TYPE_ID=$(echo "$CREATE_PRODUCT_TYPE_BODY" | jq -r '.id')
          echo "✅ Product type '${DEFECTDOJO_DEPT}' created with ID: ${PRODUCT_TYPE_ID}"
        else
          echo "❌ Failed to create product type (HTTP $CREATE_PRODUCT_TYPE_STATUS, Response: $CREATE_PRODUCT_TYPE_BODY)"
          exit 1
        fi
      fi
    # Check if product exists
    - |
      PRODUCT_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
        "${DEFECTDOJO_URL}/api/v2/products/?name=${CI_PROJECT_NAME}")
      PRODUCT_STATUS=$(echo "$PRODUCT_RESPONSE" | tail -n1)
      PRODUCT_BODY=$(echo "$PRODUCT_RESPONSE" | sed '$d')
      echo "DEBUG: Product response body: $PRODUCT_BODY"
      if [ "$PRODUCT_STATUS" -eq 200 ] && [ "$(echo "$PRODUCT_BODY" | jq '.count')" -ge 1 ]; then
        PRODUCT_ID=$(echo "$PRODUCT_BODY" | jq -r '.results[0].id')
        echo "✅ Product '${CI_PROJECT_NAME}' found with ID: ${PRODUCT_ID}"
      else
        echo "📝 Product '${CI_PROJECT_NAME}' not found, creating..."
        CREATE_PRODUCT_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
          -H "Content-Type: application/json" \
          "${DEFECTDOJO_URL}/api/v2/products/" \
          -d "{\"name\": \"${CI_PROJECT_NAME}\", \"description\": \"Auto-created product for ${CI_PROJECT_NAME}\", \"prod_type\": ${PRODUCT_TYPE_ID}}")
        CREATE_PRODUCT_STATUS=$(echo "$CREATE_PRODUCT_RESPONSE" | tail -n1)
        CREATE_PRODUCT_BODY=$(echo "$CREATE_PRODUCT_RESPONSE" | sed '$d')
        echo "DEBUG: Create product response body: $CREATE_PRODUCT_BODY"
        if [ "$CREATE_PRODUCT_STATUS" -eq 201 ]; then
          PRODUCT_ID=$(echo "$CREATE_PRODUCT_BODY" | jq -r '.id')
          echo "✅ Product '${CI_PROJECT_NAME}' created with ID: ${PRODUCT_ID}"
        else
          echo "❌ Failed to create product (HTTP $CREATE_PRODUCT_STATUS, Response: $CREATE_PRODUCT_BODY)"
          exit 1
        fi
      fi
    # Check if engagement exists
    - |
      ENGAGEMENT_NAME="test-trivy"
      ENGAGEMENT_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
        "${DEFECTDOJO_URL}/api/v2/engagements/?product=${PRODUCT_ID}&name=${ENGAGEMENT_NAME}")
      ENGAGEMENT_STATUS=$(echo "$ENGAGEMENT_RESPONSE" | tail -n1)
      ENGAGEMENT_BODY=$(echo "$ENGAGEMENT_RESPONSE" | sed '$d')
      echo "DEBUG: Engagement response body: $ENGAGEMENT_BODY"
      if [ "$ENGAGEMENT_STATUS" -eq 200 ] && [ "$(echo "$ENGAGEMENT_BODY" | jq '.count')" -ge 1 ]; then
        ENGAGEMENT_ID=$(echo "$ENGAGEMENT_BODY" | jq -r '.results[0].id')
        echo "✅ Engagement '${ENGAGEMENT_NAME}' found with ID: ${ENGAGEMENT_ID}"
      else
        echo "📝 Engagement '${ENGAGEMENT_NAME}' not found, creating..."
        ENGAGEMENT_JSON=$(jq -n \
          --arg name "$ENGAGEMENT_NAME" \
          --argjson product "$PRODUCT_ID" \
          --arg target_start "$(date +%F)" \
          --arg target_end "$(date -d "+${DEFECTDOJO_ENGAGEMENT_PERIOD} days" +%F)" \
          --arg status "$DEFECTDOJO_ENGAGEMENT_STATUS" \
          --argjson build_server "$DEFECTDOJO_ENGAGEMENT_BUILD_SERVER" \
          --argjson source_code_management_server "$DEFECTDOJO_ENGAGEMENT_SOURCE_CODE_MANAGEMENT_SERVER" \
          --argjson orchestration_engine "$DEFECTDOJO_ENGAGEMENT_ORCHESTRATION_ENGINE" \
          --argjson deduplication_on_engagement "$DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT" \
          --argjson threat_model "$DEFECTDOJO_ENGAGEMENT_THREAT_MODEL" \
          --argjson api_test "$DEFECTDOJO_ENGAGEMENT_API_TEST" \
          --argjson pen_test "$DEFECTDOJO_ENGAGEMENT_PEN_TEST" \
          --argjson check_list "$DEFECTDOJO_ENGAGEMENT_CHECK_LIST" \
          '{name: $name, product: $product, target_start: $target_start, target_end: $target_end, status: $status, build_server: $build_server, source_code_management_server: $source_code_management_server, orchestration_engine: $orchestration_engine, deduplication_on_engagement: $deduplication_on_engagement, threat_model: $threat_model, api_test: $api_test, pen_test: $pen_test, check_list: $check_list}')
        echo "DEBUG: Engagement JSON payload: $ENGAGEMENT_JSON"
        CREATE_ENGAGEMENT_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
          -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
          -H "Content-Type: application/json" \
          "${DEFECTDOJO_URL}/api/v2/engagements/" \
          -d "$ENGAGEMENT_JSON")
        CREATE_ENGAGEMENT_STATUS=$(echo "$CREATE_ENGAGEMENT_RESPONSE" | tail -n1)
        CREATE_ENGAGEMENT_BODY=$(echo "$CREATE_ENGAGEMENT_RESPONSE" | sed '$d')
        echo "DEBUG: Create engagement response body: $CREATE_ENGAGEMENT_BODY"
        if [ "$CREATE_ENGAGEMENT_STATUS" -eq 201 ]; then
          ENGAGEMENT_ID=$(echo "$CREATE_ENGAGEMENT_BODY" | jq -r '.id')
          echo "✅ Engagement '${ENGAGEMENT_NAME}' created with ID: ${ENGAGEMENT_ID}"
        else
          echo "❌ Failed to create engagement (HTTP $CREATE_ENGAGEMENT_STATUS, Response: $CREATE_ENGAGEMENT_BODY)"
          exit 1
        fi
      fi
    # Store PRODUCT_ID and ENGAGEMENT_ID for later stages
    - |
      echo "PRODUCT_ID=${PRODUCT_ID}" > product_id.env
      echo "ENGAGEMENT_ID=${ENGAGEMENT_ID}" >> product_id.env

    - source product_id.env # Load PRODUCT_ID and ENGAGEMENT_ID
    - ENGAGEMENT_NAME="test-trivy"
    - test -f trivy-results.json || { echo "❌ Trivy report not found"; exit 1; }
    - echo "📤 Uploading Trivy scan report to DefectDojo"
    - |
      curl -s -S -X POST "${DEFECTDOJO_URL}/api/v2/reimport-scan/" \
        -H "Authorization: Token ${DEFECTDOJO_TOKEN}" \
        -F "scan_date=$(date +%F)" \
        -F "minimum_severity=Medium" \
        -F "scan_type=Trivy Scan" \
        -F "active=true" \
        -F "verified=true" \
        -F "product_name=${CI_PROJECT_NAME}" \
        -F "engagement_name=${ENGAGEMENT_NAME}" \
        -F "engagement=${ENGAGEMENT_ID}" \
        -F "test_title=${TEST_TITLE}" \
        -F "auto_create_context=true" \
        -F "deduplication_on_engagement=true" \
        -F "close_old_findings=true" \
        -F "file=@trivy-results.json" \
        -w "\nHTTP Status: %{http_code}\n" \
        || ECHO_CURL_ERROR=$?
    - |
      if [ -n "$ECHO_CURL_ERROR" ]; then
        echo "❌ Failed to upload report (curl error code: $ECHO_CURL_ERROR)"
        exit 1
      fi
    - echo "✅ Upload completed"
  allow_failure: true
  when: always

.helm_security:
  stage: security
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "Scanning HELM - Security ${APP} / ${MODULE} ...