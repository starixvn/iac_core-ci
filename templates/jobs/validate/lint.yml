---
.terraform_lint:
  stage: validate
  extends: .base_terraform
  script:
    - terraform --version
    - terraform fmt -check
    - |
      cd ${TF_HOME_PATH}
      terraform init -backend-config="${TF_CONF_PATH}/backend.conf"
    - terraform validate

.unit_test:
  stage: security
  image: ${DOCKER_REG_LOCAL_URL}/base/alpine:git-3.21
  script:
    - |
      echo "Debug: APP=${APP}, MODULE=${MODULE}"