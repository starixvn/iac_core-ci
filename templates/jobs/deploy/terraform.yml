---
.terraform_apply:
  extends: .base_terraform
  stage: deploy
  script:
    - |
      echo "** Getting credentials - Project_ID ${CI_PROJECT_ID}"
      vault --version
      export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="${TF_VAR_vault_role}" jwt=${VAULT_ID_TOKEN})"
      vault token lookup
    - export AWS_PROFILE=${ENV}
    - aws configure list
    - |
      cd ${TF_HOME_PATH}
      terraform init -backend-config="${TF_CONF_PATH}/backend.conf"
      (terraform workspace select ${ENV} || terraform workspace new ${ENV})
    - echo "🚀 Deploying Terraform configuration for ${APP} - ${MODULE} in ${ENV}"
    - terraform apply -auto-approve $PLAN
  when: manual

.iac_deploy_tag:
  extends: .base_terraform
  stage: deploy
  script:
    - |
      echo "** Getting credentials - Project_ID ${CI_PROJECT_ID}"
      vault --version
      export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="${TF_VAR_vault_role}" jwt=${VAULT_ID_TOKEN})"
      vault token lookup
    - export AWS_PROFILE=${ENV}
    - aws configure list
    - |
      cd ${TF_HOME_PATH}
      terraform init -backend-config="${TF_CONF_PATH}/backend.conf"
      (terraform workspace select ${ENV} || terraform workspace new ${ENV})
    - echo "🚀 Deploying Terraform configuration for ${MODULE} - ${MODULE} in ${ENV}"
    #- terraform apply -auto-approve $PLAN
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: manual
