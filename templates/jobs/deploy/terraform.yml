---
.terraform_apply:
  extends:
    - .base_terraform
    - .terraform_cache
  stage: deploy
  script:
    - |
      echo "** Getting credentials - Project_ID ${CI_PROJECT_ID}"
      vault --version
      export VAULT_TOKEN="$(vault write -field=token auth/${VAULT_JWT_BACKEND}/login role="${TF_VAR_vault_role}" jwt=${VAULT_ID_TOKEN})"
      vault token lookup
    - export AWS_PROFILE=${S3_BACKEND_PROFILE}
    - aws configure list
    - |
      cd ${TF_HOME_PATH}
      terraform init -backend-config="${TF_CONF_PATH}/backend.conf"
      (terraform workspace select ${ENV} || terraform workspace new ${ENV})
    - echo "🚀 Deploying Terraform configuration for ${APP} - ${MODULE} in ${ENV}"
    - terraform apply -auto-approve $PLAN
