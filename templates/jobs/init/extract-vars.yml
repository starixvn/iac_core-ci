---
.extract_vars:
  stage: .pre
  script:
    - |
      if [[ "$CI_COMMIT_TAG" =~ ^deploy- ]]; then
        echo "Extracting variables from tag..."
        # Extract APP, MODULE, ORG, ENV from tag name
        if [[ "$CI_COMMIT_TAG" =~ ^deploy-([^-]+)-([^-]+)-([^-]+)-([^-]+)$ ]]; then
          APP="${BASH_REMATCH[1]}"
          MODULE="${BASH_REMATCH[2]}"
          ORG="${BASH_REMATCH[3]}"
          ENV="${BASH_REMATCH[4]}"
          
          echo "APP=$APP" >> vars.env
          echo "MODULE=$MODULE" >> vars.env
          echo "ORG=$ORG" >> vars.env
          echo "ENV=$ENV" >> vars.env
          echo "Variables extracted from tag: $CI_COMMIT_TAG"
        else
          echo "Invalid tag format. Expected: deploy-<app>-<module>-<org>-<env>"
          exit 1
        fi
      else
        echo "Not a deploy tag, skipping variable extraction"
        exit 0
      fi
  artifacts:
    reports:
      dotenv: vars.env
    when: on_success