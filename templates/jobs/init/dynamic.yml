---
.generate_dynamic_jobs:
  stage: .pre
  script:
    - |
      # version and timestamp
      echo "# Generated at $(date)" > generated-jobs.yml
      echo "# Version: 1.0" >> generated-jobs.yml
      cat > generated-jobs.yml <<'EOF'
      include:
        - project: 'iac/core-ci'
          file: '/templates/base/common.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/base/variables.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/base/stages.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/jobs/validate/lint.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/jobs/validate/security.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/jobs/plan/terraform.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/jobs/deploy/terraform.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/jobs/notify/notify.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/jobs/cleanup/cleanup.yml'
          ref: dev
      stages:
        - validate
        - security
        - plan
        - deploy
        - notify
        - cleanup

      # Validate jobs
      lint:
        extends: .terraform_lint
        stage: validate
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      security_scan:
        extends: .terraform_security
        stage: security
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      # Plan job
      plan:
        extends: .terraform_plan
        stage: plan
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      # Deploy job  
      deploy:
        extends: .terraform_apply
        stage: deploy
        needs: ["plan"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      # Notify jobs
      notify_success:
        extends: .notify_success
        stage: notify
        needs: ["deploy"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      notify_failure:
        extends: .notify_failure
        stage: notify
        needs: ["deploy"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}
      
      # Cleanup
      cleanup:
        extends: .cleanup
        stage: cleanup
      EOF
      echo "Generated jobs.yml content:"
      cat generated-jobs.yml
  artifacts:
    paths:
      - generated-jobs.yml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always

.trigger_dynamic:
  stage: init
  needs:
    - job: generate_dynamic_jobs
      artifacts: true
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: generate_dynamic_jobs

