# Template Environment as Code
---
.eac_init: &eac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/python:3.10-alpine
    entrypoint: [""]
  before_script:
    - apk add --no-cache git openssh-client
    - pip install ansible ansible-lint yamllint
    - ansible --version

.eac_validate:
  <<: *eac_init
  stage: validate
  script:
    - scripts/ansible-helpers/lint.sh

.eac_security:
  <<: *eac_init
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy config --security-checks config .

.eac_deploy:
  <<: *eac_init
  stage: deploy
  image: argoproj/argocd:2.7.4
  script:
    - scripts/ansible-helpers/argocd-sync.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/
      when: manual