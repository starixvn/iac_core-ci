# Template Environment as Code
---
.eac_init: &eac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/python:3.10-alpine
    entrypoint: [""]
  before_script:
    - apk add --no-cache git openssh-client curl bash
    - pip install ansible==${ANSIBLE_VERSION} ansible-lint

.eac_validate:
  <<: *eac_init
  stage: validate
  script:
    - |
      echo "ansible-lint --exclude=galaxy-roles/ ansible/"
      echo "yamllint ansible/"

.eac_security:
  <<: *eac_init
  stage: security
  image: aquasec/trivy:latest
  script:
    - |
      echo "trivy config --security-checks config ansible/

.eac_deploy:
  <<: *eac_init
  stage: deploy
  image: argoproj/argocd:${ARGOCD_VERSION}
  script:
    - |
      argocd login ${ARGOCD_SERVER} --grpc-web --insecure --username admin --password ${ARGOCD_TOKEN}
      if [[ -n "$APP" ]]; then
        argocd app sync ${APP}-${ENV} --grpc-web --insecure
        argocd app wait ${APP}-${ENV} --grpc-web --insecure --health
      else
        for app in $(ls argocd/apps); do
          argocd app sync ${app}-${ENV} --grpc-web --insecure
          argocd app wait ${app}-${ENV} --grpc-web --insecure --health
        done
      fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/
      when: manual

