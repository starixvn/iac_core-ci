# Template Environment as Code
---
.eac_init: &eac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/python:3.10-alpine
    entrypoint: [""]
  before_script:
    - echo "Preparing init ${APP} ..."

.eac_validate:
  <<: *eac_init
  stage: validate
  script:
    - |
      echo "ansible-lint --exclude=galaxy-roles/ ansible/"
      echo "yamllint ansible/"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.eac_security:
  stage: security
  #image: aquasec/trivy:latest
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - |
      echo "Scanning security ..."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.eac_deploy:
  <<: *eac_init
  stage: deploy
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "Deploying ${APP} to ${ENV} ..."
    # - |
    #   argocd login ${ARGOCD_SERVER} --grpc-web --insecure --username admin --password ${ARGOCD_TOKEN}
    #   if [[ -n "$APP" ]]; then
    #     argocd app sync ${APP}-${ENV} --grpc-web --insecure
    #     argocd app wait ${APP}-${ENV} --grpc-web --insecure --health
    #   else
    #     for app in $(ls argocd/apps); do
    #       argocd app sync ${app}-${ENV} --grpc-web --insecure
    #       argocd app wait ${app}-${ENV} --grpc-web --insecure --health
    #     done
    #   fi
  rules:
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/
      when: manual

