# Template Environment as Code
.eac_init: &eac_init
  image: python:3.9
  before_script:
    - pip install ansible==${ANSIBLE_VERSION}
    - ansible --version

.eac_lint:
  <<: *eac_init
  stage: validate
  script:
    - /scripts/ansible-helpers/lint.sh

.eac_sync:
  <<: *eac_init
  stage: deploy
  script:
    - /scripts/ansible-helpers/argocd-sync.sh

