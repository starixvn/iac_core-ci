# Template Environment as Code
.eac_template:
  image: alpine:latest
  before_script:
    - apk add --no-cache ansible curl git bash
    - chmod +x templates/scripts/ansible-helpers/*.sh
  stages:
    - lint
    - deploy

lint:
  stage: lint
  script:
    - templates/scripts/ansible-helpers/lint.sh
  only:
    - merge_requests
    - branches

deploy:
  stage: deploy
  script:
    - templates/scripts/ansible-helpers/argocd-sync.sh $TARGET_APP
  only:
    - main
