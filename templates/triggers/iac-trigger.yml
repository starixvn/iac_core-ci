# File: templates/triggers/iac-trigger.yml
stages:
  - validate
  - plan
  - apply

.terraform_common:
  image: hashicorp/terraform:1.4.6
  before_script:
    - terraform init

vault-plan:
  extends: .terraform_common
  script:
    - cd $CI_PROJECT_DIR/vault
    - terraform plan

vault-apply:
  stage: apply
  extends: .terraform_common
  script:
    - cd $CI_PROJECT_DIR/vault
    - terraform apply -auto-approve