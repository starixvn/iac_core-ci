# File: templates/triggers/iac-trigger.yml
trigger:iac:
  stage: triggers
  image: registry.gitlab.com/gitlab-org/cli:latest
  script:
    - glab ci run --branch $CI_COMMIT_REF_NAME --project-id $IAC_REPO_ID
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^iac-/ || $CI_COMMIT_MESSAGE =~ /\[trigger iac\]/
  tags:
    - core-ci