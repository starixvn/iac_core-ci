---
# IaC Base Template
.predefined_id_tokens:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: 'https://gitlab.nexdev.net'

.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: ["/usr/bin/env"]
  before_script:
    - echo "${APP} | ${ENV:-local} - $ENV | $TF_DATA_DIR"
    - mkdir -p ${TF_DATA_DIR}
    - echo -e "credentials \"$CI_SERVER_HOST\" {\n  token = \"$CI_JOB_TOKEN\"\n}" > $TF_DATA_DIR
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
    - terraform --version
    - cd $CI_PROJECT_DIR/applications/${APP}
    - terraform init -backend=false -input=false

.iac_validate:
  <<: *iac_init
  stage: validate
  variables:
    ENV: ${ENV:-local}
  script:
    - echo "app $APP"
    - ls $CI_PROJECT_DIR
    - cd $CI_PROJECT_DIR/applications/${APP}
    - terraform validate
    - terraform fmt 
    #-check -recursive
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
 # allow_failure: true
 
.iac_security:
  stage: security
  #image: aquasec/tfsec:latest
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "app $APP"
    - echo "Scanning Security... ${APP}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    #- tfsec .

.iac_plan:
  <<: *iac_init
  stage: plan
  script:
    - echo "App $APP | Env $ENV | $TF_CLI_CONFIG_FILE"
    - cd applications/${APP}
    - export AWS_PROFILE=$ENV
    - aws configure list
    - |
        echo "** Getting credentials"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${ENV}/${APP}.hcl"
    - terraform plan -var-file="$CI_PROJECT_DIR/environments/${ENV}/${APP}.tfvars" -out=tfplan
  artifacts:
    paths:
      - applications/${APP}/tfplan
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
  #allow_failure: true

.iac_deploy:
  <<: *iac_init
  stage: deploy
  script:
    - echo "🚀 Deploying Terraform configuration for ${APP} in ${ENVIRONMENT}"
    - cd applications/${APP}
    #- terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
      when: manual
