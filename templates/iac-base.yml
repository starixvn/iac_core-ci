---
# IaC Base Template
.predefined_id_tokens:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: 'https://gitlab.nexdev.net'

.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: ["/usr/bin/env"]
  before_script:
    - echo "$CHANGED_TOOLS | $CI_SERVER_HOST | $CI_JOB_TOKEN | $TF_CLI_CONFIG_FILE"
    - echo -e "credentials \"$CI_SERVER_HOST\" {\n  token = \"$CI_JOB_TOKEN\"\n}" > $TF_CLI_CONFIG_FILE
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - git config --global url."https://ansible:$CI_JOB_TOKEN@$CI_SERVER_HOST".insteadOf "https://$CI_SERVER_HOST"
    - ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
    - terraform --version
    
.iac_validate:
  <<: *iac_init
  stage: validate
  script:
    - echo "validate $CHANGED_TOOLS"
    - ls $CI_PROJECT_DIR
    #- cd $CI_PROJECT_DIR/applications/${APP_MAIN}/${APP}
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export VAULT_ENV=local
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - |
      for tool in $CHANGED_TOOLS; do
        APP_MAIN=$(echo "$tool" | cut -d'/' -f1)
        APP=$(echo "$tool" | cut -d'/' -f2)
        echo "🔧 validate $APP_MAIN / $APP | $VAULT_ENV ...";
        echo "$CI_PROJECT_DIR/applications/$APP_MAIN/$APP ";
        terraform init -backend-config="$CI_PROJECT_DIR/environments/${VAULT_ENV}/${APP_MAIN}/${APP}/${VAULT_ENV}.hcl"
        (terraform workspace select ${VAULT_ENV} || terraform workspace new ${VAULT_ENV})
        terraform validate
        terraform fmt 
      done

  rules:
    - changes:
        - applications/*/*
        - applications/*/*/*
        - environments/*/*/*
        - environments/*/*/*/*
    - when: never
 
.iac_security_tf:
  stage: security
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "app $APP"
    - echo "Scanning TF - Security... ${APP}"
  rules:
    - changes:
        - applications/*/*
        - applications/*/*/*
        - environments/*/*/*
        - environments/*/*/*/*
    - when: never

.iac_security_helm:
  stage: security
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "app $APP"
    - echo "Scanning HELM - Security... ${APP}"
  rules:
    - changes:
        - applications/*/*
        - applications/*/*/*
    - when: never

#####################################
.iac_plan_env:
  <<: *iac_init
  stage: plan
  script:
    - echo "App $APP | Env $ENV | $TF_CLI_CONFIG_FILE"
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${VAULT_ENV}/${APP_MAIN}/${APP}/${VAULT_ENV}.hcl"
    - (terraform workspace select ${VAULT_ENV} ||
      terraform workspace new ${VAULT_ENV})
    - echo "Preparing Terraform configuration for ${APP} in ${ENV}"
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -var-file="$CI_PROJECT_DIR/environments/${ENV}/${APP_MAIN}/${APP}/${VAULT_ENV}.tfvars" -out=${PLAN}
    - "terraform show -json $PLAN | convert_report > ${JSON_PLAN_FILE}"
  artifacts:
    name: $APP-$ENV
    reports:
      terraform: ${CI_PROJECT_DIR}/applications/${APP_MAIN}/${APP}/${JSON_PLAN_FILE}
    paths:
      - $CI_PROJECT_DIR/applications/${APP_MAIN}/${APP}/${JSON_PLAN_FILE}
      - $CI_PROJECT_DIR/applications/${APP_MAIN}/${APP}/${PLAN}
    expire_in: 1 week
  rules:
    - changes:
        - environments/*/*/*
        - environments/*/*/*/*
    - when: never


.iac_deploy_env:
  <<: *iac_init
  stage: deploy
  script:
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${VAULT_ENV}/${APP_MAIN}/${APP}/${VAULT_ENV}.hcl"
    - (terraform workspace select ${VAULT_ENV} ||
      terraform workspace new ${VAULT_ENV})
    - echo "🚀 Deploying Terraform configuration for ${APP} - ${APP} in ${VAULT_ENV}"
    #- terraform apply -auto-approve $PLAN
  rules:
    - changes:
        - environments/*/*/*
        - environments/*/*/*/*
      when: manual
    - when: never


#####################################
.iac_plan:
  <<: *iac_init
  stage: plan
  script:
    - echo "App $APP | Env $ENV | $TF_CLI_CONFIG_FILE"
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${VAULT_ENV}/${APP_MAIN}/${APP}/${VAULT_ENV}.hcl"
    - (terraform workspace select ${VAULT_ENV} ||
      terraform workspace new ${VAULT_ENV})
    - echo "Preparing Terraform configuration for ${APP} in ${ENV}"
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -var-file="$CI_PROJECT_DIR/environments/${ENV}/${APP_MAIN}/${APP}/${VAULT_ENV}.tfvars" -out=${PLAN}
    - "terraform show -json $PLAN | convert_report > ${JSON_PLAN_FILE}"
  artifacts:
    name: $APP-$ENV
    reports:
      terraform: ${CI_PROJECT_DIR}/applications/${APP_MAIN}/${APP}/${JSON_PLAN_FILE}
    paths:
      - $CI_PROJECT_DIR/applications/${APP_MAIN}/${APP}/${JSON_PLAN_FILE}
      - $CI_PROJECT_DIR/applications/${APP_MAIN}/${APP}/${PLAN}
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'

.iac_deploy:
  <<: *iac_init
  stage: deploy
  script:
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${VAULT_ENV}/${APP_MAIN}/${APP}/${VAULT_ENV}.hcl"
    - (terraform workspace select ${VAULT_ENV} ||
      terraform workspace new ${VAULT_ENV})
    - echo "🚀 Deploying Terraform configuration for ${APP} - ${APP} in ${VAULT_ENV}"
    #- terraform apply -auto-approve $PLAN
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
      when: manual
