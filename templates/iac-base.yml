---
# IaC Base Template
.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: ["/usr/bin/env"]
  before_script:
    - terraform --version
    - echo ${APP}
    - cd applications/${APP}
    - terraform init -backend=false
    - cd
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

.iac_validate:
  <<: *iac_init
  stage: validate
  script:
    - |
      for app in $(ls applications); do
        APP=$app
        echo "app is ${APP}"
        cd applications/${APP}
        terraform validate
      done
    #- cd applications/${APP}
    #- terraform validate
    #- terraform fmt -check -recursive

.iac_security:
  <<: *iac_init
  stage: security
  #image: aquasec/tfsec:latest
  script:
    - echo "Scanning Security..."
    - ls 
    - ls applications/${APP}
    #- tfsec .

.iac_plan:
  <<: *iac_init
  stage: plan
  script:
    - cd applications/${APP}
    - terraform plan -var-file="environments/${ENV}/${APP}.tfvars" -out=tfplan
  artifacts:
    paths:
      - applications/${APP}/tfplan
    expire_in: 1 week

.iac_deploy:
  <<: *iac_init
  stage: deploy
  script:
    - echo "🚀 Deploying Terraform configuration for ${APP} in ${ENVIRONMENT}"
    - cd applications/${APP}
    - terraform apply -auto-approve tfplan

