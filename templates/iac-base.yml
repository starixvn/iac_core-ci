# IaC Base Template
.iac_init: &iac_init
#  image: hashicorp/terraform:${TF_VERSION}
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint:
        - "/usr/bin/env"
        - "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  before_script:
    - terraform --version
    - terraform init -backend=false
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"

.iac_validate:
  <<: *iac_init
  stage: validate
  script:
    - /scripts/tf-helpers/validate.sh

.iac_deploy:
  <<: *iac_init
  stage: deploy
  script:
    - /scripts/tf-helpers/deploy.sh
  dependencies: []

