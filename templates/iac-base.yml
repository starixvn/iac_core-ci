# IaC Base Template
.iac_template:
  image: hashicorp/terraform:${TERRAFORM_VERSION}
  before_script:
    - export TF_WORKSPACE=${ENVIRONMENT:-dev}
    - cd applications/${APP_NAME}
  cache:
    key: ${CI_JOB_NAME}-${APP_NAME}
    paths:
      - .terraform
  artifacts:
    paths:
      - tfplan.json
    expire_in: 1 week

validate_terraform:
  extends: .iac_template
  stage: validate
  script:
    - chmod +x ${CI_PROJECT_DIR}/.gitlab-ci/scripts/tf-helpers/validate.sh
    - ${CI_PROJECT_DIR}/.gitlab-ci/scripts/tf-helpers/validate.sh ${APP_NAME}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

plan_terraform:
  extends: .iac_template
  stage: plan
  script:
    - terraform init -backend-config="../../environments/${ENVIRONMENT}/backend.hcl"
    - terraform plan -out=tfplan -var-file="../../environments/${ENVIRONMENT}/${APP_NAME}.tfvars"
    - terraform show -json tfplan > tfplan.json