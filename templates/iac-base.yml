# IaC Base Template
---
.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint:
        - "/usr/bin/env"
    entrypoint: [""]
  before_script:
    - terraform --version
    - mkdir -p ${TF_DATA_DIR}
    - terraform init -backend=false -input=false
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TF_DATA_DIR: "${CI_PROJECT_DIR}/.terraform"

.iac_fmt:
  <<: *iac_init
  stage: validate
  script:
    - terraform fmt -check -recursive
    - terraform validate

.iac_plan:
  <<: *iac_init
  stage: test
  script:
    - terraform plan -var-file=environments/${ENVIRONMENT}/${APP}.tfvars -out=tfplan
  artifacts:
    paths:
      - tfplan
    expire_in: 1 week

.iac_apply:
  <<: *iac_init
  stage: deploy
  script:
    - terraform apply -auto-approve tfplan
  dependencies:
    - iac_plan
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: false
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: false

.iac_destroy:
  <<: *iac_init
  stage: deploy
  script:
    - terraform destroy -auto-approve -var-file=environments/${ENVIRONMENT}/${APP}.tfvars
  when: manual
  allow_failure: false