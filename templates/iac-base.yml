---
# IaC Base Template
.extract_tag_vars:
  stage: extract
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "checking deploy tag $CI_COMMIT_TAG ..."
    - |
      if echo "$CI_COMMIT_TAG" | grep -Eq "deploy-[a-z-]+-(local|dev|staging|production)$"; then
        APP=${BASH_REMATCH[1]}
        ENV=${BASH_REMATCH[2]}
        echo "Extracted APP=${BASH_REMATCH[1]}, ENV=${BASH_REMATCH[2]} from tag"
      else
        echo "FAIL"
      fi
    - echo  "$APP $ENV | ${APP} ${ENV}"
  artifacts:
    reports:
      dotenv: tag_vars.env
  rules:
    #- if: '$CI_COMMIT_TAG =~ $TAG_REGEX'
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'

.iac_detect_app:
  stage: detect
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "Checking for changes between $CI_COMMIT_BEFORE_SHA and $CI_COMMIT_SHA"
    - echo "Modified files:"
    - git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA || true
    - |
      # For merge requests or branch pushes
      if [ $CI_PROJECT_ID == "3061" ]; then
        # IaC repo - look for changes in applications directory
        changed=$(git diff --name-only HEAD~1 | grep -E 'applications/([^/]+)/' | cut -d'/' -f2 | sort | uniq)
      elif [ $CI_PROJECT_ID == "3062" ]; then
        # EaC repo - look for changes in argocd/apps directory
        changed=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep -E '^argocd/apps/([^/]+)/' | cut -d'/' -f3 | sort | uniq)
      fi
      
      if [ -z "$changed" ]; then
        echo "No application changes detected"
        exit 0
      elif [ $(echo "$changed" | wc -l) -gt 1 ]; then
        echo "Multiple applications changed: $changed"
        exit 1
      else
        echo "Detected changed APP(s): $changed"
        # Take first app if multiple changed (or modify as needed)
        APP=$(echo "$changed" | head -n1)
        echo "APP=$APP" >> app.env
      fi
    - if [ -f app.env ]; then cat app.env; else echo "No app.env created"; fi
  artifacts:
    reports:
      dotenv: app.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.predefined_id_tokens:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: 'https://gitlab.nexdev.net'

.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: ["/usr/bin/env"]
  before_script:
    - echo "${APP} | ${ENV:-local} - $ENV | $TF_CLI_CONFIG_FILE"
    - echo -e "credentials \"$CI_SERVER_HOST\" {\n  token = \"$CI_JOB_TOKEN\"\n}" > $TF_CLI_CONFIG_FILE
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
    - terraform --version
    - ls $CI_PROJECT_DIR
    - cd applications/${APP}
    - export AWS_PROFILE=${ENV:-local}
    - aws configure list
    - |
        echo "** Getting credentials"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role=$TF_VAR_vault_role jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${ENV:-local}/${APP}.hcl"
    #- cd
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TF_VAR_vault_role: vault_jwt_auth_backend-pipeline
    #ENV: ${ENV:-local}
  allow_failure: true

.iac_validate:
  <<: *iac_init
  stage: validate
  variables:
    ENV: ${ENV:-local}
  script:
    - echo "app $APP"
    - ls
    - terraform validate
    #- terraform fmt -check -recursive
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
 
.iac_security:
  stage: security
  #image: aquasec/tfsec:latest
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "app $APP"
    - echo "Scanning Security... ${APP}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    #- tfsec .

.iac_plan:
  #<<: *iac_init
  stage: plan
  script:
    - echo "${APP} $APP | ${ENV:-local} - $ENV | $TF_CLI_CONFIG_FILE"
    - cd applications/${APP}
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${ENV}/${APP}.hcl"
    - terraform plan -var-file="$CI_PROJECT_DIR/environments/${ENV}/${APP}.tfvars" -out=tfplan
  artifacts:
    paths:
      - applications/${APP}/tfplan
    expire_in: 1 week
  rules:
    #- if: '$CI_COMMIT_TAG =~ $TAG_REGEX'
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'

.iac_deploy:
  #<<: *iac_init
  stage: deploy
  script:
    - echo "🚀 Deploying Terraform configuration for ${APP} in ${ENVIRONMENT}"
    - cd applications/${APP}
    - terraform apply -auto-approve tfplan
  rules:
    #- if: '$CI_COMMIT_TAG =~ $TAG_REGEX'
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
      when: manual
