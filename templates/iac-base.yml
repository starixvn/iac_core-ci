---
# IaC Base Template
.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: ["/usr/bin/env"]
  before_script:
    - terraform --version
    - echo ${APP}
    - ls applications/${APP}
    #- cd applications/${APP}
    #- terraform init -backend=false
    #- cd
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
  allow_failure: true

.iac_validate:
  <<: *iac_init
  stage: validate
  variables:
    APP: ${APP}
  script:
    - echo "app $APP - ${APP}"
    - ls
    - terraform validate
    #- terraform fmt -check -recursive
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  allow_failure: true
  # script:
  #   - |
  #     for app in $(ls applications); do
  #       APP=$app
  #       echo "app is ${APP}"
  #       cd applications/${APP}
  #       terraform validate
  #     done
    #- cd applications/${APP}
    #- terraform validate
    #- terraform fmt -check -recursive

.iac_security:
  <<: *iac_init
  stage: security
  #image: aquasec/tfsec:latest
  variables:
    APP: ${APP}
  script:
    - echo "app $APP - ${APP}"
    - echo "Scanning Security... ${APP}"
    - ls 
    - ls applications/${APP}
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    #- tfsec .

.iac_plan:
  <<: *iac_init
  stage: plan
  variables:
    APP: "${CI_COMMIT_TAG#deploy-}"
    ENV: "${CI_COMMIT_TAG##*-}"
  script:
    - cd applications/${APP}
    - terraform plan -var-file="../environments/${ENV:-dev}/${APP}.tfvars" -out=tfplan
  artifacts:
    paths:
      - applications/${APP}/tfplan
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'

.iac_deploy:
  <<: *iac_init
  stage: deploy
  variables:
    APP: "${CI_COMMIT_TAG#deploy-}"
    ENV: "${CI_COMMIT_TAG##*-}"
  script:
    - echo "🚀 Deploying Terraform configuration for ${APP} in ${ENVIRONMENT}"
    - cd applications/${APP}
    - terraform apply -auto-approve tfplan
  rules:
    - if: $CI_COMMIT_TAG =~ /^deploy-(.+)-(.+)$/
      when: manual
