---
# IaC Base Template
.predefined_id_tokens:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: 'https://gitlab.nexdev.net'

.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: ["/usr/bin/env"]
  before_script:
    - echo "${APP} | $VAULT_ENV | $CI_SERVER_HOST | $CI_JOB_TOKEN | $TF_CLI_CONFIG_FILE"
    - echo -e "credentials \"$CI_SERVER_HOST\" {\n  token = \"$CI_JOB_TOKEN\"\n}" > $TF_CLI_CONFIG_FILE
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - cd $CI_PROJECT_DIR/applications/${APP}
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - git config --global url."https://ansible:$CI_JOB_TOKEN@$CI_SERVER_HOST".insteadOf "https://$CI_SERVER_HOST"
    - ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
    - terraform --version
#    - terraform init -backend=false -input=false

.iac_validate:
  <<: *iac_init
  stage: validate
  script:
    - echo "app $APP"
    - ls $CI_PROJECT_DIR
    - cd $CI_PROJECT_DIR/applications/${APP}
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - (terraform workspace select ${VAULT_ENV} ||
      terraform workspace new ${VAULT_ENV})
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${VAULT_ENV}/${APP}.hcl"
    - terraform validate
    - terraform fmt 
    #-check -recursive
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
 # allow_failure: true
 
.iac_security:
  stage: security
  #image: aquasec/tfsec:latest
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "app $APP"
    - echo "Scanning Security... ${APP}"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    #- tfsec .

.iac_plan:
  <<: *iac_init
  stage: plan
  script:
    - echo "App $APP | Env $ENV | $TF_CLI_CONFIG_FILE"
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${VAULT_ENV}/${APP}.hcl"
    - (terraform workspace select ${VAULT_ENV} ||
      terraform workspace new ${VAULT_ENV})
    - echo "Preparing Terraform configuration for ${APP} in ${ENVIRONMENT}"
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -var-file="$CI_PROJECT_DIR/environments/${ENV}/${APP}.tfvars" -out=${PLAN}
    - "terraform show -json $PLAN | convert_report > ${JSON_PLAN_FILE}"
  artifacts:
    name: $APP-$ENV
    reports:
      terraform: ${CI_PROJECT_DIR}/applications/${APP}/${JSON_PLAN_FILE}
    paths:
      - $CI_PROJECT_DIR/applications/${APP}/${JSON_PLAN_FILE}
      - $CI_PROJECT_DIR/applications/${APP}/${PLAN}
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
  #allow_failure: true

.iac_deploy:
  <<: *iac_init
  stage: deploy
  script:
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - terraform init -backend-config="$CI_PROJECT_DIR/environments/${VAULT_ENV}/${APP}.hcl"
    - (terraform workspace select ${VAULT_ENV} ||
      terraform workspace new ${VAULT_ENV})
    - echo "🚀 Deploying Terraform configuration for ${APP} in ${ENVIRONMENT}"
    #- cd applications/${APP}
    #- terraform apply -auto-approve tfplan
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'
      when: manual
