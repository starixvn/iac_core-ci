# Template Infrastructure as Code
.iac_template:
  image: 
    name: hashicorp/terraform:1.5.0
    entrypoint: [""]
  before_script:
    - export TF_WORKSPACE=${ENVIRONMENT:-dev}
    - cd applications/${APP_NAME}
  cache:
    key: ${CI_JOB_NAME}-${APP_NAME}
    paths:
      - .terraform
  artifacts:
    paths:
      - tfplan
    expire_in: 1 week

validate_terraform:
  extends: .iac_template
  stage: validate
  script:
    - terraform init -backend=false
    - terraform validate
    - terraform fmt -check -diff -no-color
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

plan_terraform:
  extends: .iac_template
  stage: plan
  script:
    - terraform init -backend-config="../../environments/${ENVIRONMENT}/backend.hcl"
    - terraform plan -out=tfplan -var-file="../../environments/${ENVIRONMENT}/${APP_NAME}.tfvars"
    - terraform show -json tfplan > tfplan.json
  artifacts:
    reports:
      terraform: tfplan.json