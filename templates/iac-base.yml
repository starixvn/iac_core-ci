# IaC Base Template
---
.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint:
        - "/usr/bin/env"
    entrypoint: [""]
  before_script:
    - terraform --version
    - mkdir -p ${TF_DATA_DIR}
    - terraform init -backend=false -input=false
  variables:
    TF_IN_AUTOMATION: "true"
    TF_INPUT: "false"
    TF_DATA_DIR: "${CI_PROJECT_DIR}/.terraform"

.iac_validate:
  <<: *iac_init
  stage: validate
  script:
    - scripts/tf-helpers/validate.sh
  artifacts:
    paths:
      - .terraform/
    expire_in: 1 week

.iac_security:
  <<: *iac_init
  stage: security
  image: aquasec/tfsec:latest
  script:
    - tfsec .

.iac_deploy:
  <<: *iac_init
  stage: deploy
  script:
    - scripts/tf-helpers/deploy.sh
  rules:
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/
      when: manual

