# IaC Base Template
.iac_template:
  image: hashicorp/terraform:light
  before_script:
    - chmod +x .gitlab-ci/scripts/tf-helpers/*.sh
  variables:
    TF_IN_AUTOMATION: "true"
  stages:
    - validate
    - plan
    - apply

validate:
  stage: validate
  script:
    - .gitlab-ci/scripts/tf-helpers/validate.sh $TARGET_ENV
  only:
    - merge_requests
    - branches

plan:
  stage: plan
  script:
    - terraform init
    - terraform plan -var-file=environments/$TARGET_ENV/${APP}.tfvars
  only:
    - merge_requests
    - branches

apply:
  stage: apply
  script:
    - .gitlab-ci/scripts/tf-helpers/deploy.sh $TARGET_ENV
  only:
    - main