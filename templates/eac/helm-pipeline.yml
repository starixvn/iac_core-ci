# File: templates/eac/helm-pipeline.yml
lint:helm:
  stage: apps
  image: alpine/helm:$HELM_VERSION
  script:
    - helm lint ./charts/*
    - helm-docs

deploy:apps:
  stage: apps
  image: alpine/helm:$HELM_VERSION
  script:
    - |
      helm upgrade --install redis ./charts/redis \
        --namespace apps \
        --values ./charts/redis/values-$CI_ENVIRONMENT_NAME.yaml \
        --atomic --timeout 5m
  environment:
    name: $CI_ENVIRONMENT_NAME