# File: templates/eac/k8s-pipeline.yml
deploy:cluster:
  stage: cluster
  image: quay.io/kubespray/kubespray:v2.23.0
  script:
    - ansible-playbook -i inventory/hosts.yaml cluster.yml -e "@${TF_OUTPUTS_FILE}"
  artifacts:
    paths:
      - admin.conf
    reports:
      junit: reports/kubespray.xml

test:cluster:
  stage: cluster
  image: bitnami/kubectl:$KUBE_VERSION
  script:
    - kubectl get nodes -o wide
    - kubectl cluster-info