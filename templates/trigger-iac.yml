# File: templates/trigger-iac.yml
trigger:iac:
  stage: trigger
  image: curlimages/curl:latest
  script:
    - |
      curl -X POST \
        -H "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        -F "ref=${CI_COMMIT_REF_NAME}" \
        -F "variables[IAC_COMMIT_SHA]=${CI_COMMIT_SHA}" \
        "${CI_API_V4_URL}/projects/${IAC_PROJECT_ID}/trigger/pipeline"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^iac-/