.extract_tag_vars:
  stage: extract
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "checking deploy tag $CI_COMMIT_TAG ..."
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        APP_MAIN=$(echo "$CI_COMMIT_TAG" | cut -d'-' -f2)
        APP=$(echo "$CI_COMMIT_TAG" | cut -d'-' -f3)
        ENV=$(echo "$CI_COMMIT_TAG" | cut -d'-' -f4)
        if echo ${ENV:-local} | grep -q "local"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.nexdev.net";
        elif echo ${ENV:-local} | grep -q "dev"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault-dev.nexdev.net";
        elif echo ${ENV:-local} | grep -q "uat"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.starixuat.com";
        fi;
            echo "APP_MAIN=$APP_MAIN" >> tag_vars.env
            echo "APP=$APP" >> tag_vars.env
            echo "ENV=$ENV" >> tag_vars.env
            echo "VAULT_ENV=$VAULT_ENV" >> tag_vars.env
            echo "VAULT_ADDR=$VAULT_ADDR" >> tag_vars.env
            echo "Extracted APP_MAIN=$APP_MAIN, APP=$APP, ENV=$ENV | $VAULT_ENV , $VAULT_ADDR"
      else
        echo "FAIL"
      fi
  artifacts:
    reports:
      dotenv: tag_vars.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'

.detect_app:
  stage: detect
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "Checking for changes between $CI_COMMIT_BEFORE_SHA and $CI_COMMIT_SHA"
    - echo "Modified files:"
    - git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA || true
    - |
      CHANGED=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA)
      if echo "$CHANGED" | grep -E 'applications/([^/]+)/([^/]+)/' ; then 
        APP_MAIN=$(echo "$CI_COMMIT_TAG" | cut -d'/' -f2)
        APP=$(echo "$CI_COMMIT_TAG" | cut -d'/' -f3)
        echo "APP_MAIN=$APP_MAIN" >> tag_vars.env
        echo "APP=$APP" >> vars.env
        echo "ENV=${ENV:-local}" >> vars.env
        echo "VAULT_ENV=$ENV" >> vars.env
        echo "VAULT_ADDR=${VAULT_ADDR:-https://vault.nexdev.net}" >> vars.env
        echo "APP_TOOL_CHANGED=true" >> vars.env
        echo "Extracted APP_TOOL_CHANGED APP_MAIN=$APP_MAIN, APP=$APP, ENV=$ENV | $VAULT_ENV , $VAULT_ADDR"
      elif echo "$CHANGED" | grep -E 'environment/([^/]+)/([^/]+)/' ; then 
        APP_MAIN=$(echo "$CI_COMMIT_TAG" | cut -d'/' -f2)
        APP=$(echo "$CI_COMMIT_TAG" | cut -d'/' -f3)
        ENV=$(echo "$CI_COMMIT_TAG" | cut -d'/' -f1)
        echo "APP_MAIN=$APP_MAIN" >> tag_vars.env
        echo "APP=$APP" >> vars.env
        echo "ENV=$ENV" >> vars.env
        echo "VAULT_ENV=$VAULT_ENV" >> vars.env
        echo "VAULT_ADDR=$VAULT_ADDR" >> vars.env
        echo "ENV_TOOL_CHANGED=true" >> vars.env
        echo "Extracted ENV_TOOL_CHANGED APP_MAIN=$APP_MAIN, APP=$APP, ENV=$ENV | $VAULT_ENV , $VAULT_ADDR"

      fi
  artifacts:
    reports:
      dotenv: vars.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'