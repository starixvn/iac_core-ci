.extract_tag_vars:
  stage: extract
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "checking deploy tag $CI_COMMIT_TAG ..."
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        APP=$(echo "$CI_COMMIT_TAG" | cut -d'-' -f2)
        ENV=$(echo "$CI_COMMIT_TAG" | cut -d'-' -f3)
        if echo ${ENV:-local} | grep -q "local"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.nexdev.net";
        elif echo ${ENV:-local} | grep -q "dev"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault-dev.nexdev.net";
        elif echo ${ENV:-local} | grep -q "uat"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.starixuat.com";
        fi;
            echo "APP=$APP" >> tag_vars.env
            echo "ENV=$ENV" >> tag_vars.env
            echo "VAULT_ENV=$VAULT_ENV" >> tag_vars.env
            echo "VAULT_ADDR=$VAULT_ADDR" >> tag_vars.env
            echo "Extracted APP=$APP, ENV=$ENV | $VAULT_ENV , $VAULT_ADDR"
      else
        echo "FAIL"
      fi
  artifacts:
    reports:
      dotenv: tag_vars.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-.+-.+$/'

.detect_app:
  stage: detect
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "Checking for changes between $CI_COMMIT_BEFORE_SHA and $CI_COMMIT_SHA"
    - echo "Modified files:"
    - git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA || true
    - |
      # For merge requests or branch pushes
      if [ $CI_PROJECT_ID == "3061" ]; then
        # IaC repo - look for changes in applications directory
        changed=$(git diff --name-only HEAD~1 | grep -E 'applications/([^/]+)/' | cut -d'/' -f2 | sort | uniq)
      elif [ $CI_PROJECT_ID == "3062" ]; then
        # EaC repo - look for changes in argocd/apps directory
        changed=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA | grep -E '^argocd/apps/([^/]+)/' | cut -d'/' -f3 | sort | uniq)
      fi
      
      if [ -z "$changed" ]; then
        echo "No application changes detected"
        exit 0
      elif [ $(echo "$changed" | wc -l) -gt 1 ]; then
        echo "Multiple applications changed: $changed"
        exit 1
      else
        echo "Detected changed APP(s): $changed"
        # Take first app if multiple changed (or modify as needed)
        export VAULT_ENV=local;export VAULT_ADDR="https://vault.nexdev.net";
        APP=$(echo "$changed" | head -n1)
        echo "APP=$APP" >> app.env
        echo "VAULT_ENV=$VAULT_ENV" >> app.env
        echo "VAULT_ADDR=$VAULT_ADDR" >> app.env
      fi
    - if [ -f app.env ]; then cat app.env; else echo "No app.env created"; fi
  artifacts:
    reports:
      dotenv: app.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'