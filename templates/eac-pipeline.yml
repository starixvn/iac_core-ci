# File: templates/eac-pipeline.yml
kubespray:deploy:
  stage: provision
  image: quay.io/kubespray/kubespray:v2.23.0
  script:
    - ansible-playbook -i inventory/hosts.yaml cluster.yml -e "@${CI_PROJECT_DIR}/terraform_vars.json"
  artifacts:
    paths:
      - ${KUBECONFIG}

helm:deploy:
  stage: configure
  image: alpine/helm:${HELM_VERSION}
  script:
    - |
      helm upgrade --install redis ./helm/redis \
        --set auth.password=$(vault read -field=password secret/redis) \
        -f ./helm/values/${CI_ENVIRONMENT_NAME}.yaml
    - |
      helm upgrade --install harbor ./helm/harbor \
        --set externalURL="harbor.${DOMAIN}" \
        --set persistence.storageClass="minio"
  needs: ["kubespray:deploy"]

notify:status:
  stage: notify
  image: curlimages/curl:latest
  script:
    - |
      curl -X POST ${SLACK_WEBHOOK} \
        -H 'Content-Type: application/json' \
        -d '{"text":"Deployed ${CI_PROJECT_NAME}@${CI_COMMIT_SHA} to ${CI_ENVIRONMENT_NAME}"}'