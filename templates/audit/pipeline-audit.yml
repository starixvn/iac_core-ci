# File: templates/audit/pipeline-audit.yml
audit:logs:
  stage: audit
  image: alpine:latest
  script:
    - apk add jq
    - glab api /projects/$IAC_REPO_ID/pipelines | jq '.[] | {id, status}'
    - glab api /projects/$EAC_REPO_ID/pipelines | jq '.[] | {id, status}'
  artifacts:
    when: always
    paths:
      - audit.log