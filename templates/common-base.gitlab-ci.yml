---
# Job 1: Extract Tag vars
.extract_tag_vars:
  stage: .pre
  image: hub.nexdev.net/base/alpine:git-3.21
  script:
    - echo "checking deploy tag $CI_COMMIT_TAG ..."
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        APP=$(echo "$CI_COMMIT_TAG" | cut -d'_' -f2)
        MODULE=$(echo "$CI_COMMIT_TAG" | cut -d'_' -f3)
        ORG=$(echo "$CI_COMMIT_TAG" | cut -d'_' -f4)
        ENV=$(echo "$CI_COMMIT_TAG" | cut -d'_' -f5)
        if [ "$ORG" == "starix" ];
        then
          if echo ${ENV} | grep -q "local"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.nexdev.net";
          elif echo ${ENV} | grep -q "dev"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault-dev.nexdev.net";
          elif echo ${ENV} | grep -q "uat"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.starixuat.com";
          elif echo ${ENV} | grep -q "sit"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.playonesit.com";
          elif echo ${ENV} | grep -q "kldr"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vn-st-vault.byb6181.com";
          elif echo ${ENV} | grep -q "prod"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.starixplay.com";
          fi;
        elif [ "$ORG" == "lumi" ];
        then
          if echo ${ENV} | grep -q "local"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.lumigame.com";
          elif echo ${ENV} | grep -q "uat"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://uat";
          elif echo ${ENV} | grep -q "sit"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://sit";
          elif echo ${ENV} | grep -q "kldr"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://kldr";
          elif echo ${ENV} | grep -q "prod"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://prod";
          fi;
        fi;
        echo "APP=$APP" >> tag_vars.env
        echo "MODULE=$MODULE" >> tag_vars.env
        echo "ORG=$ORG" >> tag_vars.env
        echo "ENV=$ENV" >> tag_vars.env
        echo "VAULT_ENV=$VAULT_ENV" >> tag_vars.env
        echo "VAULT_ADDR=$VAULT_ADDR" >> tag_vars.env
        echo "Extracted APP=$APP, MODULE=$MODULE, ORG=$ORG, ENV=$ENV | $VAULT_ENV , $VAULT_ADDR"
      else
        echo "FAIL with tag $CI_COMMIT_TAG"
      fi

  artifacts:
    reports:
      dotenv: tag_vars.env
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'

# Job 2: Detect changes
detect_changes:
  stage: .pre
  script:
    - |
      mkdir -p "${CI_PROJECT_DIR}/tmp"
      CHANGE_FILE="${CI_PROJECT_DIR}/tmp/changed_vars.env"
      touch "${CHANGE_FILE}"

      if [ -n "$CI_MERGE_REQUEST_CHANGED_PATHS" ]; then
        echo "Using Merge Request changed paths..."
        mapfile -t CHANGED_FILES <<< "$CI_MERGE_REQUEST_CHANGED_PATHS"
      else
        if [ "$CI_COMMIT_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
          echo "Using git diff for changes..."
          mapfile -t CHANGED_FILES < <(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA 2>/dev/null || echo "")
        fi
      fi

      declare -A UNIQUE_PATHS
        for file in "${CHANGED_FILES[@]}"; do
        # Case 1: variable.d changes (tool/module/variable.d/org/env/...)
        if [[ "$file" =~ ^([^/]+)/([^/]+)/variable\.d/([^/]+)/([^/]+)/ ]]; then
          APP="${BASH_REMATCH[1]}"
          MODULE="${BASH_REMATCH[2]}"
          ORG="${BASH_REMATCH[3]}"
          ENV="${BASH_REMATCH[4]}"
          KEY="${APP}_${MODULE}_${ORG}_${ENV}"
          UNIQUE_PATHS["$KEY"]=1

        # Case 2: General file changes inside tool/module/ but not in variable.d/
        elif [[ "$file" =~ ^([^/]+)/([^/]+)/(.*)$ ]]; then
          APP="${BASH_REMATCH[1]}"
          MODULE="${BASH_REMATCH[2]}"
          SUBPATH="${BASH_REMATCH[3]}"
          
          if [[ ! "$SUBPATH" =~ ^variable\.d/ ]]; then
            KEY="${APP}_${MODULE}"
            UNIQUE_PATHS["$KEY"]=1
          fi
        fi
      done

      for path in "${!UNIQUE_PATHS[@]}"; do
        echo "${path}_CHANGED=true" >> "${CHANGE_FILE}"
      done

      mv "${CHANGE_FILE}" "${CI_PROJECT_DIR}/"
      echo "Detected changes:"
      cat changed_vars.env || echo "No changes detected"
  artifacts:
    paths:
      - changed_vars.env
    when: always
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always
      

# Job 3: Generate dynamic jobs
.generate_dynamic_jobs:
  stage: .pre
  script:
    - |
      cat > generated-jobs.yml <<'EOF'
      include:
        - project: 'iac/core-ci'
          file: '/includes/common-vars.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/templates/iac-base.gitlab-ci.yml'
          ref: dev
        - project: 'iac/core-ci'
          file: '/includes/notify.yml'
          ref: dev

      stages:
        - init
        - validate
        - security
        - plan
        - deploy
        - notify
        - cleanup

      no_changes:
        stage: init
        script:
          - echo "No changes detected in any module"
        rules:
          - if: '$CI_PIPELINE_SOURCE == "push"'
            when: never
          - when: on_success
      EOF

      CHANGED_MODULES=0
      if [ -f changed_vars.env ]; then
        echo "Processing detected changes..."
        while IFS='=' read -r var_name _; do
          if [[ "$var_name" =~ ^([^_]+)_([^_]+)_([^_]+)_([^_]+)_CHANGED$ ]]; then
            APP="${BASH_REMATCH[1]}"
            MODULE="${BASH_REMATCH[2]}"
            ORG="${BASH_REMATCH[3]}"
            ENV="${BASH_REMATCH[4]}"
            echo "Generating full ENV jobs for ${APP}_${MODULE}_${ORG}_${ENV}..."

            cat >> generated-jobs.yml <<EOF

      ${APP}_${MODULE}_${ORG}_${ENV}_validate:
        stage: validate
        extends: [".iac_validate",".predefined_id_tokens"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      ${APP}_${MODULE}_${ORG}_${ENV}_scan:
        stage: validate
        extends: [".iac_security_tf"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      ${APP}_${MODULE}_${ORG}_${ENV}_plan:
        stage: plan
        extends: [".iac_plan",".predefined_id_tokens"]
        needs: ["${APP}_${MODULE}_${ORG}_${ENV}_validate","${APP}_${MODULE}_${ORG}_${ENV}_scan"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      ${APP}_${MODULE}_${ORG}_${ENV}_deploy:
        stage: deploy
        extends: [".iac_deploy",".predefined_id_tokens"]
        needs: ["${APP}_${MODULE}_${ORG}_${ENV}_plan"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}

      ${APP}_${MODULE}_${ORG}_${ENV}_notify_success:
        stage: notify
        extends: [".notify_job_success"]
        needs: ["${APP}_${MODULE}_${ORG}_${ENV}_deploy"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}
          ORG: ${ORG}
          ENV: ${ENV}
      
      EOF
            CHANGED_MODULES=$((CHANGED_MODULES + 1))

      elif [[ "$var_name" =~ ^([^_]+)_([^_]+)_CHANGED$ ]]; then
        APP="${BASH_REMATCH[1]}"
        MODULE="${BASH_REMATCH[2]}"
        echo "Generating basic MODULE jobs for ${APP}_${MODULE}..."

        cat >> generated-jobs.yml <<EOF

      ${APP}_${MODULE}_unit_test:
        stage: validate
        extends: [".unit_test"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}

      ${APP}_${MODULE}_scan:
        stage: security
        extends: [".iac_security_tf"]
        needs: ["${APP}_${MODULE}_unit_test"]
        variables:
          APP: ${APP}
          MODULE: ${MODULE}

      EOF
            CHANGED_MODULES=$((CHANGED_MODULES + 1))
          fi
        done < changed_vars.env
      else
        echo "No module changes detected."
      fi

      if [ $CHANGED_MODULES -gt 0 ]; then
        sed -i '/no_changes:/,/when: on_success/d' generated-jobs.yml
      fi
      echo "Generated jobs.yml content:"
      cat generated-jobs.yml
  artifacts:
    paths:
      - generated-jobs.yml
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: always