---
include:
  - project: 'iac/core-ci'
    file: '/templates/base/common.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/variables.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/dynamic.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/stages.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/validate/lint.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/validate/security.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/plan/terraform.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/notify/notify.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/cleanup/cleanup.yml'
    ref: dev

stages:
  - .pre
  - init
  - validate
  - security
  - plan
  - deploy
  - notify
  - cleanup

# Phát hiện thay đổi
detect_changes:
  extends: .detect_changes

# Tạo jobs động
generate_dynamic_jobs:
  extends: .generate_dynamic_jobs
  needs: ["detect_changes"]

# Kích hoạt pipeline con
trigger_dynamic:
  stage: init
  needs:
    - job: generate_dynamic_jobs
      artifacts: true
  trigger:
    include:
      - artifact: generated-jobs.yml
        job: generate_dynamic_jobs
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: always
    - when: always

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'