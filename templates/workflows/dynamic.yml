---
include:
  - project: 'iac/core-ci'
    file: '/templates/base/common.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/cache.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/variables.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/dynamic.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/stages.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/validate/lint.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/validate/security.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/plan/terraform.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/deploy/terraform.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/notify/notify.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/detect-changes.yml'
    ref: dev

# Phát hiện thay đổi
detect_changes:
  extends: .detect_changes

# Tạo jobs động
generate_dynamic_jobs:
  extends: .generate_dynamic_jobs
  needs: ["detect_changes"]

# Kích hoạt pipeline con
trigger_dynamic:
  extends: .trigger_dynamic
  needs: ["generate_dynamic_jobs"]
