---
include:
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/extract-vars.yml'
    ref: security
  - project: 'iac/core-ci'
    file: '/templates/jobs/cleanup/cleanup.yml'
    ref: security
default:
  tags:
    - "${RUNNER_TAG}"

extract_tag_vars:
  extends: .extract_vars
  after_script:
    - *notify_pipeline_failure
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
    - when: never
plan:
  extends:
    - .predefined_id_tokens
    - .terraform_plan
  needs: ["extract_tag_vars"]
  after_script:
    - *notify_pipeline_failure
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always

deploy:
  extends:
    - .predefined_id_tokens
    - .terraform_apply
  needs: ["extract_tag_vars", "plan"]
  after_script:
    - *notify_pipeline_failure
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: manual
    - when: never

notify:
  extends: .notify_pipeline_success
  needs: ["deploy"]
  variables:
    CI_JOB_STATUS: "success"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
    - when: never

cleanup:
  extends: .cleanup_tag
  needs: ["deploy"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
    - when: never
