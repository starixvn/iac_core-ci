---
include:
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/extract-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/jobs/cleanup/cleanup.yml'
    ref: main

extract_tag_vars:
  extends: .extract_vars
  after_script:
    - !reference [.notify_pipeline_failure, script]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
    - when: never
plan:
  extends:
    - .predefined_id_tokens
    - .terraform_plan
  needs: ["extract_tag_vars"]
  after_script:
    - !reference [.notify_pipeline_failure, script]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always

deploy:
  extends:
    - .predefined_id_tokens
    - .terraform_apply
  needs: ["extract_tag_vars", "plan"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: manual

notify:
  extends: .notify_pipeline_success
  needs: ["extract_tag_vars", "deploy"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always

cleanup:
  extends: .cleanup_tag
  needs: ["deploy", "notify"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always

