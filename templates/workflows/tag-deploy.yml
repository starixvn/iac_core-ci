---
include:
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/extract-vars.yml'
    ref: main
  - project: 'iac/core-ci'
    file: '/templates/jobs/cleanup/cleanup.yml'
    ref: main
default:
  tags:
    - "${RUNNER_TAG}"

extract_tag_vars:
  extends: .extract_vars
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
    - when: never
plan:
  extends:
    - .predefined_id_tokens
    - .terraform_plan
  needs: ["extract_tag_vars"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always

deploy:
  extends:
    - .predefined_id_tokens
    - .terraform_apply
  needs: ["extract_tag_vars", "plan"]
  after_script:
    - !reference [.notify_pipeline_failure, script]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: manual
    - when: never

notify_automatic_job_failure:
  extends: .notify_pipeline_failure
  needs: ["extract_tag_vars", "plan"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/ && $CI_PIPELINE_SUCCESS'
      when: on_failure
    - when: never

notify_manual_job_failure:
  extends: .notify_pipeline_failure
  needs: ["extract_tag_vars", "deploy"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/ && $CI_PIPELINE_SUCCESS'
      when: on_failure
    - when: never

notify_success:
  extends: .notify_pipeline_success
  needs: ["deploy"]
  variables:
    CI_JOB_STATUS: "success"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
    - when: never

cleanup:
  extends: .cleanup_tag
  needs: ["deploy"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
    - when: never
