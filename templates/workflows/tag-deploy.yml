---
include:
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/extract-vars.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/cleanup/cleanup.yml'
    ref: dev

extract_tag_vars:
  extends: .extract_vars
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-/'
      when: always
    - when: never
#deploy_vault_starix-infra_starix_local
plan:
  extends: 
    - .predefined_id_tokens
    - .terraform_plan
  needs: ["extract_tag_vars"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-/'
      when: always
    - when: never
 
deploy:
  extends: 
    - .predefined_id_tokens
    - .terraform_apply
  needs: ["extract_tag_vars", "plan"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-/'
      when: manual
    - when: never
 
notify:
  extends: .notify_pipeline_success
  needs: ["deploy"]
  variables:
    CI_JOB_STATUS: "success"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy-/'
      when: always
    - when: never

cleanup:
  extends: .cleanup_tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: always
    - when: never
