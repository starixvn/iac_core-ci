---
variables:
  # Docker registry
  RUNNER_TAG: "k8s"
  DEBUG: "0"
  #DOCKER_REG_LOCAL_URL: "${CI_REGISTRY}"
  # Terraform related
  TF_ROOT: ${APP}/${MODULE}
  TRIVY_VERSION: "0.24.2"
  DEFECTDOJO_URL: "https://defectdojo.nexdev.net"
  DEFECTDOJO_API_KEY: "19c0a551c892ba79f1bf36d6d1fe87a504d0d406"
  TEST_TITLE: "Trivy CI Scan"
  DEFECTDOJO_ENGAGEMENT_PERIOD: 7
  DEFECTDOJO_ENGAGEMENT_STATUS: "Not Started"
  DEFECTDOJO_DEPT: "NX-Atomix"

  # DefectDojo configuration defaults
  DEFECTDOJO_ENGAGEMENT_BUILD_SERVER: "null"
  DEFECTDOJO_ENGAGEMENT_SOURCE_CODE_MANAGEMENT_SERVER: "null"
  DEFECTDOJO_ENGAGEMENT_ORCHESTRATION_ENGINE: "null"
  DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT: "false"
  DEFECTDOJO_ENGAGEMENT_THREAT_MODEL: "true"
  DEFECTDOJO_ENGAGEMENT_API_TEST: "true"
  DEFECTDOJO_ENGAGEMENT_PEN_TEST: "true"
  DEFECTDOJO_ENGAGEMENT_CHECK_LIST: "true"

  
  
  PLAN: plan.tfplan
  JSON_PLAN_FILE: tfplan.json
  TF_CLI_CONFIG_FILE: ${CI_PROJECT_DIR}/.terraformrc
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-lock-timeout=300s"
  TF_CLI_ARGS_apply: "-lock-timeout=300s"
  # Vault related
  TF_VAR_vault_role: "vault_jwt_auth_backend-pipeline"
  # Default values
  #DEFAULT_BRANCH: "main"
  SLACK_WEBHOOK_URL: ${CI_SLACK_WEBHOOK_URL}
  SLACK_CHANNEL: "deploy-command-center"