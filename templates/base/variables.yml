---
variables:
  # Docker registry
  RUNNER_TAG: "k8s"
  #DOCKER_REG_LOCAL_URL: "${CI_REGISTRY}"
  # Terraform related
  TF_ROOT: ${APP}/${MODULE}
  PLAN: plan.tfplan
  JSON_PLAN_FILE: tfplan.json
  TF_CLI_CONFIG_FILE: ${CI_PROJECT_DIR}/.terraformrc
  TF_CLI_ARGS: "-no-color"
  TF_CLI_ARGS_plan: "-lock-timeout=300s"
  TF_CLI_ARGS_apply: "-lock-timeout=300s"
  # Vault related
  TF_VAR_vault_role: "vault_jwt_auth_backend-pipeline"
  # Default values
  #DEFAULT_BRANCH: "main"
  SLACK_WEBHOOK_URL: ${CI_SLACK_WEBHOOK_URL}
  SLACK_CHANNEL: "deploy-command-center"