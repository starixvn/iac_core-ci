---
# IaC Base Template
.unit_test:
  stage: security
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - |
      echo "Debug: APP=${APP}, MODULE=${MODULE}"
####################
.predefined_id_tokens:
  id_tokens:
    VAULT_ID_TOKEN:
      aud: 'https://gitlab.nexdev.net'

.iac_init: &iac_init
  image:
    name: $DOCKER_REG_LOCAL_URL/base/hashicorp/terraform:1.4.5-vault
    entrypoint: ["/usr/bin/env"]
  before_script:
    - |
      echo "Debug: APP=${APP}, MODULE=${MODULE}, ORG=${ORG}, ENV=${ENV}"
      echo "Current path: $(pwd) | CI_PROJECT_DIR ${CI_PROJECT_DIR}"
    - |
      if [ "$ORG" == "starix" ];
      then
        if echo ${ENV} | grep -q "local"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.nexdev.net";
        elif echo ${ENV} | grep -q "dev"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault-dev.nexdev.net";
        elif echo ${ENV} | grep -q "uat"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.starixuat.com";
        elif echo ${ENV} | grep -q "sit"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.playonesit.com";
        elif echo ${ENV} | grep -q "kldr"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vn-st-vault.byb6181.com";
        elif echo ${ENV} | grep -q "prod"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.starixplay.com";
        fi;
      elif [ "$ORG" == "lumi" ];
      then
        if echo ${ENV} | grep -q "local"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://vault.lumigame.com";
        elif echo ${ENV} | grep -q "uat"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://uat";
        elif echo ${ENV} | grep -q "sit"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://sit";
        elif echo ${ENV} | grep -q "kldr"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://kldr";
        elif echo ${ENV} | grep -q "prod"; then export VAULT_ENV=$ENV;export VAULT_ADDR="https://prod";
        fi;
      fi;
    - echo "Debug VAULT_ENV=${VAULT_ENV}, VAULT_ADDR=${VAULT_ADDR}"
    - echo "$CI_SERVER_HOST | $CI_JOB_TOKEN | $TF_CLI_CONFIG_FILE"
    - echo -e "credentials \"$CI_SERVER_HOST\" {\n  token = \"$CI_JOB_TOKEN\"\n}" > $TF_CLI_CONFIG_FILE
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - git config --global user.email "ansible@nexdev.net"
    - git config --global user.name "ansible"
    - git config --global url."https://ansible:$CI_JOB_TOKEN@$CI_SERVER_HOST".insteadOf "https://$CI_SERVER_HOST"
    - ssh-keyscan -t rsa gitlab.nexdev.net >> ~/.ssh/known_hosts ;
    - terraform --version
    
.iac_validate:
  <<: *iac_init
  stage: validate
  script:
    - echo "validate $VAULT_ENV"
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - |
        echo "🔧 validate $APP / $MODULE | $VAULT_ENV ...";
        echo "$CI_PROJECT_DIR/$APP/$MODULE ";
        cd $CI_PROJECT_DIR/$APP/$MODULE
        terraform init -backend-config="$CI_PROJECT_DIR/$APP/$MODULE/variable.d/${ORG}/${VAULT_ENV}/backend.conf"
        (terraform workspace select ${VAULT_ENV} || terraform workspace new ${VAULT_ENV})
        terraform validate
        terraform fmt 
 
.iac_security_tf:
  stage: security
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "Scanning TF - Security $APP / $MODULE ...";

.iac_security_helm:
  stage: security
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  script:
    - echo "Scanning HELM - Security $APP / $MODULE ...";

#####################################
#####################################
.iac_plan:
  <<: *iac_init
  stage: plan
  script:
    - echo "App $MODULE_MAIN / $MODULE | Env $ENV | $TF_CLI_CONFIG_FILE"
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - |
        cd $CI_PROJECT_DIR/$APP/$MODULE
        terraform init -backend-config="$CI_PROJECT_DIR/$APP/$MODULE/variable.d/${ORG}/${VAULT_ENV}/backend.conf"
        (terraform workspace select ${VAULT_ENV} || terraform workspace new ${VAULT_ENV})
    - echo "Preparing Terraform configuration for ${MODULE} ${MODULE} in ${ENV}"
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -var-file="$CI_PROJECT_DIR/$APP/$MODULE/variable.d/${ORG}/${VAULT_ENV}/variables.tfvars" -out=${PLAN}
    - "terraform show -json $PLAN | convert_report > ${JSON_PLAN_FILE}"
  artifacts:
    name: $APP-$MODULE-$ENV
    reports:
      terraform: ${CI_PROJECT_DIR}/${APP}/${MODULE}/${JSON_PLAN_FILE}
    paths:
      - $CI_PROJECT_DIR/${APP}/${MODULE}/${JSON_PLAN_FILE}
      - $CI_PROJECT_DIR/${APP}/${MODULE}/${PLAN}
    expire_in: 1 week
  after_script:
    - !reference [.notify_job_failure, script]
  

.iac_deploy:
  <<: *iac_init
  stage: deploy
  script:
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - |
        cd $CI_PROJECT_DIR/$APP/$MODULE
        terraform init -backend-config="$CI_PROJECT_DIR/$APP/$MODULE/variable.d/${ORG}/${VAULT_ENV}/backend.conf"
        (terraform workspace select ${VAULT_ENV} || terraform workspace new ${VAULT_ENV})
    - echo "🚀 Deploying Terraform configuration for ${MODULE} - ${MODULE} in ${VAULT_ENV}"
    #- terraform apply -auto-approve $PLAN
  when: manual

##################################### Deploy TAGs
#####################################
.iac_plan_tag:
  <<: *iac_init
  stage: plan
  script:
    - echo "App $MODULE_MAIN / $MODULE | Env $ENV | $TF_CLI_CONFIG_FILE"
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - |
        cd $CI_PROJECT_DIR/$APP/$MODULE
        terraform init -backend-config="$CI_PROJECT_DIR/$APP/$MODULE/variable.d/${ORG}/${VAULT_ENV}/backend.conf"
        (terraform workspace select ${VAULT_ENV} || terraform workspace new ${VAULT_ENV})
    - echo "Preparing Terraform configuration for ${MODULE} ${MODULE} in ${ENV}"
    - alias convert_report="jq -r '([.resource_changes[]?.change.actions?]|flatten)|{\"create\":(map(select(.==\"create\"))|length),\"update\":(map(select(.==\"update\"))|length),\"delete\":(map(select(.==\"delete\"))|length)}'"
    - terraform plan -var-file="$CI_PROJECT_DIR/$APP/$MODULE/variable.d/${ORG}/${VAULT_ENV}/variables.tfvars" -out=${PLAN}
    - "terraform show -json $PLAN | convert_report > ${JSON_PLAN_FILE}"
  artifacts:
    name: $APP-$MODULE-$ENV
    reports:
      terraform: ${CI_PROJECT_DIR}/${APP}/${MODULE}/${JSON_PLAN_FILE}
    paths:
      - $CI_PROJECT_DIR/${APP}/${MODULE}/${JSON_PLAN_FILE}
      - $CI_PROJECT_DIR/${APP}/${MODULE}/${PLAN}
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'

.iac_deploy_tag:
  <<: *iac_init
  stage: deploy
  script:
    - |
        echo "** Getting credentials - Project_ID $CI_PROJECT_ID"
        vault --version
        export VAULT_TOKEN="$(vault write -field=token auth/jwt/login role="$TF_VAR_vault_role" jwt=$VAULT_ID_TOKEN)"
        vault token lookup
    - export AWS_PROFILE=$VAULT_ENV
    - aws configure list
    - |
        cd $CI_PROJECT_DIR/$APP/$MODULE
        terraform init -backend-config="$CI_PROJECT_DIR/$APP/$MODULE/variable.d/${ORG}/${VAULT_ENV}/backend.conf"
        (terraform workspace select ${VAULT_ENV} || terraform workspace new ${VAULT_ENV})
    - echo "🚀 Deploying Terraform configuration for ${MODULE} - ${MODULE} in ${VAULT_ENV}"
    #- terraform apply -auto-approve $PLAN
  rules:
    - if: '$CI_COMMIT_TAG =~ /^deploy_.+_.+$/'
      when: manual
