---
include:
 # GitLab CI/CD includes configuration
  - project: 'iac/core-ci'
    file: '/templates/base/common.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/variables.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/stages.yml'
    ref: dev
  - local: '**/security.yml'

# Kiểm tra cú pháp file YAML
lint_ci_files:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: validate
  script:
    - |
      CHANGED_FILES=""
      if [ -n "$CI_MERGE_REQUEST_CHANGED_PATHS" ]; then
        CHANGED_FILES="$CI_MERGE_REQUEST_CHANGED_PATHS"
      else
        CHANGED_FILES=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA)
      fi
      for file in $CHANGED_FILES; do
        if [[ "$file" =~ \.yml$ ]] || [[ "$file" =~ \.yaml$ ]]; then
          echo "Checking syntax for $file"
          if ! yamllint -c .yamllint "$file"; then
            echo "❌ Syntax check failed for $file"
            exit 1
          fi
          echo "✅ Syntax check passed for $file"
        fi
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"

# Kiểm tra đường dẫn include
validate_templates:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: validate
  script:
    - |
      for template in $(find . -name "*.yml" -o -name "*.yaml"); do
        echo "Validating includes in $template"
        while IFS= read -r include_path; do
          if [[ "$include_path" =~ ^local: ]]; then
            path=${include_path#*:}
            path=${path//\'/}
            path=${path//\"/}
            if [ ! -f "${path#/}" ]; then
              echo "❌ Include path not found: $path in $template"
              exit 1
            fi
          fi
        done < <(grep -E "^\s*-\s*local:" "$template" 2>/dev/null)
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"

trivy_scan_job:
  extends:
    - .trivy_security
  stage: security
  variables:
    #Defect Dojo Variable
    ENGAGEMENT_NAME: "${CI_PROJECT_NAME}-${TEST_TITLE}"
    DEFECTDOJO_DEPT: "NX-Atomix"
    CI_PROJECT_NAME: "${CI_PROJECT_NAME}"
    CI_PROJECT_PATH: "${CI_PROJECT_PATH}"
    DEFECTDOJO_PRODUCT_NAME: "${CI_PROJECT_NAME}"
    DEFECTDOJO_PRODUCT_VERSION: "${CI_COMMIT_REF_NAME}"
    TRIVY_VERSION: "${TRIVY_VERSION}"  # or specify a version
    TEST_TITLE: "Trivy Security Scan"
    DEFECTDOJO_ENGAGEMENT_PERIOD: "30"  # engagement period in days
    DEFECTDOJO_ENGAGEMENT_STATUS: "In Progress"
    DEFECTDOJO_ENGAGEMENT_BUILD_SERVER: "null"
    DEFECTDOJO_ENGAGEMENT_SOURCE_CODE_MANAGEMENT_SERVER: "null"
    DEFECTDOJO_ENGAGEMENT_ORCHESTRATION_ENGINE: "null"
    DEFECTDOJO_ENGAGEMENT_DEDUPLICATION_ON_ENGAGEMENT: "true"
    DEFECTDOJO_ENGAGEMENT_THREAT_MODEL: "true"
    DEFECTDOJO_ENGAGEMENT_API_TEST: "true"
    DEFECTDOJO_ENGAGEMENT_PEN_TEST: "true"
    DEFECTDOJO_ENGAGEMENT_CHECK_LIST: "true"
    DEFECTDOJO_NOT_ON_MASTER: "false"
