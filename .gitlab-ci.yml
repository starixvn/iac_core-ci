---
include:
  - project: 'iac/core-ci'
    file: '/templates/base/common.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/variables.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/stages.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/detect-changes.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/init/extract-vars.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/jobs/deploy/terraform.yml'
    ref: dev
  
  # Workflows
  - local: '/templates/workflows/dynamic.yml'

# Kiểm tra cú pháp file YAML
lint_ci_files:
  extends: .base_job
  stage: validate
  before_script:
    - apk add --no-cache yamllint
  script:
    - |
      CHANGED_FILES=""
      if [ -n "$CI_MERGE_REQUEST_CHANGED_PATHS" ]; then
        CHANGED_FILES="$CI_MERGE_REQUEST_CHANGED_PATHS"
      else
        CHANGED_FILES=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA)
      fi
      for file in $CHANGED_FILES; do
        if [[ "$file" =~ \.yml$ ]] || [[ "$file" =~ \.yaml$ ]]; then
          echo "Checking syntax for $file"
          if ! yamllint -c .yamllint "$file"; then
            echo "❌ Syntax check failed for $file"
            exit 1
          fi
          echo "✅ Syntax check passed for $file"
        fi
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"

# Kiểm tra đường dẫn include  
validate_templates:
  extends: .base_job
  stage: validate
  script:
    - |
      for template in $(find . -name "*.yml" -o -name "*.yaml"); do
        echo "Validating includes in $template"
        while IFS= read -r include_path; do
          if [[ "$include_path" =~ ^local: ]]; then
            path=${include_path#*:}
            path=${path//\'/}
            path=${path//\"/}
            if [ ! -f "${path#/}" ]; then
              echo "❌ Include path not found: $path in $template"
              exit 1
            fi
          fi
        done < <(grep -E "^\s*-\s*local:" "$template" 2>/dev/null)
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"

# Thêm job mới: Kiểm tra cấu trúc EaC
validate_eac_structure:
  extends: .base_job
  stage: validate
  script:
    - |
      # Kiểm tra cấu trúc thư mục và file bắt buộc
      required_dirs=(
        "templates/base"
        "templates/jobs"
        "templates/workflows"
      )
      
      required_files=(
        "templates/base/common.yml"
        "templates/base/variables.yml"
        "templates/base/stages.yml"
      )
      
      for dir in "${required_dirs[@]}"; do
        if [ ! -d "$dir" ]; then
          echo "❌ Required directory not found: $dir"
          exit 1
        fi
      done
      
      for file in "${required_files[@]}"; do
        if [ ! -f "$file" ]; then
          echo "❌ Required file not found: $file"
          exit 1
        fi
      done
      
      # Kiểm tra cấu trúc của các file template
      for template in $(find templates -name "*.yml"); do
        echo "Validating structure of $template"
        
        # Kiểm tra các key bắt buộc trong template
        if ! yq e 'has("include")' "$template" &>/dev/null && \
           ! yq e 'keys | any(. == "extends")' "$template" &>/dev/null; then
          echo "❌ Template $template must have either 'include' or job definitions with 'extends'"
          exit 1
        fi
        
        # Kiểm tra định dạng job name
        yq e 'keys | .[]' "$template" | while read -r key; do
          if [[ "$key" =~ ^[^._].* ]] && ! [[ "$key" =~ ^(include|stages|variables|default)$ ]]; then
            if ! [[ "$key" =~ ^[a-z][a-z0-9_-]*$ ]]; then
              echo "❌ Invalid job name format in $template: $key"
              exit 1
            fi
          fi
        done
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "templates/**/*.yml"
        - "templates/**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "templates/**/*.yml"
        - "templates/**/*.yaml"