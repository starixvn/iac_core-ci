---
include:
  - local: '/templates/base/common.yml'
  - local: '/templates/base/variables.yml'
  - local: '/templates/base/stages.yml'
  - local: '/templates/jobs/validate/lint.yml'
  - local: '/includes/notify.yml'

stages:
  - .pre
  - validate
  - test
  - deploy

extract_tag_vars:
  stage: .pre
  extends: .extract_vars
# Kiểm tra cú pháp file YAML
lint_ci_files:
  extends: .base_job
  stage: validate
  before_script:
    - apk add --no-cache yamllint
  script:
    - |
      CHANGED_FILES=""
      if [ -n "$CI_MERGE_REQUEST_CHANGED_PATHS" ]; then
        CHANGED_FILES="$CI_MERGE_REQUEST_CHANGED_PATHS"
      else
        CHANGED_FILES=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA)
      fi
      for file in $CHANGED_FILES; do
        if [[ "$file" =~ \.yml$ ]] || [[ "$file" =~ \.yaml$ ]]; then
          echo "Checking syntax for $file"
          if ! yamllint -c .yamllint "$file"; then
            echo "❌ Syntax check failed for $file"
            exit 1
          fi
          echo "✅ Syntax check passed for $file"
        fi
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"

# Kiểm tra đường dẫn include
validate_templates:
  extends: .base_job
  stage: validate
  script:
    - |
      for template in $(find . -name "*.yml" -o -name "*.yaml"); do
        echo "Validating includes in $template"
        while IFS= read -r include_path; do
          if [[ "$include_path" =~ ^local: ]]; then
            path=${include_path#*:}
            path=${path//\'/}
            path=${path//\"/}
            if [ ! -f "${path#/}" ]; then
              echo "❌ Include path not found: $path in $template"
              exit 1
            fi
          fi
        done < <(grep -E "^\s*-\s*local:" "$template" 2>/dev/null)
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"