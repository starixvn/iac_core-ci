# Core CI Pipeline Template Repository
include:
  - local: '/templates/iac-base.yml'
  - local: '/templates/eac-base.yml'
  - local: '/templates/notify.yml'
  - local: '/includes/common-vars.yml'
  - local: '/includes/secrets.yml'
  - local: '/includes/tag-trigger.yml'

# variables:
#   GIT_STRATEGY: clone
#   TF_VERSION: "1.5.7"
#   ANSIBLE_VERSION: "2.15.3"
stages:
  - detect
  - validate
  - test
  - security
  - plan
  - deploy
  - notify

variables:
  TF_VERSION: "1.5.7"
  ANSIBLE_VERSION: "2.15.3"
  ARGOCD_VERSION: "2.7.4"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^deploy-.+-.+/