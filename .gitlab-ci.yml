# Core CI Pipeline Template Repository
stages:
  - validate
  - deploy
  - notify

include:
  - local: 'includes/common-vars.yml'
  - local: 'includes/secrets.yml'

.default:
  image: alpine:latest
  before_script:
    - apk add --no-cache bash curl git openssh

# =================
# IaC Trigger Job
# =================
iac-trigger:
  stage: deploy
  trigger:
    include:
      - local: '.gitlab-ci/templates/iac-base.yml'
    strategy: depend

# =================
# EaC Trigger Job
# =================
eac-trigger:
  stage: deploy
  trigger:
    include:
      - local: '.gitlab-ci/templates/eac-base.yml'
    strategy: depend

# ================
# Notify Job
# ================
notify:
  stage: notify
  trigger:
    include:
      - local: '.gitlab-ci/templates/notify.yml'
    strategy: depend