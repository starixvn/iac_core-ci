# File: .gitlab-ci.yml
# Repository: Core CI
# Mục đích: Cung cấp templates và scripts chuẩn cho cả IaC và EaC

stages:
  - validate
  - build
  - deploy
  - notify

variables:
  TF_VERSION: "1.5.0"
  ARGOCD_VERSION: "2.7.0"
  ANSIBLE_VERSION: "7.4.0"

# Include các file template
include:
  - local: 'templates/iac-base.yml'
  - local: 'templates/eac-base.yml'
  - local: 'templates/notify.yml'
  - local: 'includes/common-vars.yml'
  - local: 'includes/secrets.yml'

# Job build templates (chạy khi có thay đổi templates)
build_templates:
  stage: build
  image: alpine:latest
  script:
    - echo "Validating CI templates..."
    - yamllint -d relaxed templates/*.yml
    - shellcheck scripts/**/*.sh
  only:
    refs:
      - main
    changes:
      - templates/*.yml
      - scripts/**/*.sh

# Job test các helper scripts
test_helpers:
  stage: validate
  image: docker:latest
  services:
    - docker:dind
  script:
    - |
      echo "Testing Terraform helpers..."
      docker run --rm -v ${PWD}/scripts:/scripts bash /scripts/tf-helpers/validate.sh
    - |
      echo "Testing Ansible helpers..."
      docker run --rm -v ${PWD}/scripts:/scripts python:${ANSIBLE_VERSION}-alpine \
        sh /scripts/ansible-helpers/lint.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"  # Chạy định kỳ hàng ngày

# Job đồng bộ templates sang các repo khác
sync_templates:
  stage: deploy
  image: alpine/git:latest
  variables:
    IAC_REPO_URL: "git@gitlab.com:devops/iac-repo.git"
    EAC_REPO_URL: "git@gitlab.com:devops/eac-repo.git"
  script:
    - |
      echo "Syncing templates to IaC repo..."
      git clone ${IAC_REPO_URL} /tmp/iac-repo
      cp -r templates/iac-* /tmp/iac-repo/
      cd /tmp/iac-repo
      git add 
      git commit -m "Update CI templates from core-ci [skip ci]"
      git push
    - |
      echo "Syncing templates to EaC repo..."
      git clone ${EAC_REPO_URL} /tmp/eac-repo
      cp -r templates/eac-* /tmp/eac-repo/
      cd /tmp/eac-repo
      git add 
      git commit -m "Update CI templates from core-ci [skip ci]"
      git push
  only:
    - main
  when: manual

# Job quét bảo mật
security_scan:
  stage: validate
  image: securego/gosec:latest
  script:
    - gosec -quiet -exclude-dir=./scripts/ ./...
  allow_failure: true
  artifacts:
    reports:
      sast: gl-security-report.json

notify_success:
  extends: .notify
  variables:
    MESSAGE: "Core CI templates updated successfully!"
  when: on_success