# Core CI Pipeline Template Repository
include:
  - local: '/templates/iac-base.yml'
  - local: '/templates/eac-base.yml'
  - local: '/includes/common-vars.yml'
  - local: '/includes/secrets.yml'

variables:
  GIT_STRATEGY: clone
  TF_VERSION: "1.5.7"
  ANSIBLE_VERSION: "2.15.3"
stages:
  - validate
  - test
  - deploy
  - notify

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    
