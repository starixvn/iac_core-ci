---
include:
 # GitLab CI/CD includes configuration
  - project: 'iac/core-ci'
    file: '/templates/base/common.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/variables.yml'
    ref: dev
  - project: 'iac/core-ci'
    file: '/templates/base/stages.yml'
    ref: dev
  - local: '**/security.yml'

# Kiểm tra cú pháp file YAML
lint_ci_files:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: validate
  script:
    - |
      CHANGED_FILES=""
      if [ -n "$CI_MERGE_REQUEST_CHANGED_PATHS" ]; then
        CHANGED_FILES="$CI_MERGE_REQUEST_CHANGED_PATHS"
      else
        CHANGED_FILES=$(git diff --name-only $CI_COMMIT_BEFORE_SHA $CI_COMMIT_SHA)
      fi
      for file in $CHANGED_FILES; do
        if [[ "$file" =~ \.yml$ ]] || [[ "$file" =~ \.yaml$ ]]; then
          echo "Checking syntax for $file"
          if ! yamllint -c .yamllint "$file"; then
            echo "❌ Syntax check failed for $file"
            exit 1
          fi
          echo "✅ Syntax check passed for $file"
        fi
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"

# Kiểm tra đường dẫn include
validate_templates:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: validate
  script:
    - |
      for template in $(find . -name "*.yml" -o -name "*.yaml"); do
        echo "Validating includes in $template"
        while IFS= read -r include_path; do
          if [[ "$include_path" =~ ^local: ]]; then
            path=${include_path#*:}
            path=${path//\'/}
            path=${path//\"/}
            if [ ! -f "${path#/}" ]; then
              echo "❌ Include path not found: $path in $template"
              exit 1
            fi
          fi
        done < <(grep -E "^\s*-\s*local:" "$template" 2>/dev/null)
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - "**/*.yml"
        - "**/*.yaml"

Trivy_Scan:
  extends:
    - .upload_reports
    - .trivy_security
  stage: security


upload_reports:
  image: $DOCKER_REG_LOCAL_URL/base/alpine:git-3.21
  stage: security
  needs:
    - job: Trivy_Scan
      artifacts: true
  before_script:
    - source product_id.env
    - ENGAGEMENT_NAME="${CI_PROJECT_NAME}/${TEST_TITLE}"
    - ENGAGEMENT_NAME=$(echo "$ENGAGEMENT_NAME" | tr -s '[:space:]' '-' | tr -d '[:punct:]' | tr '[:upper:]' '[:lower:]')
    - test -f trivy-results.json || { echo "❌ Trivy report not found"; exit 1; }
  script:
    - |
    - echo "📤 Uploading Trivy scan report to DefectDojo"
    - |
      curl -s -S -X POST "${DEFECTDOJO_URL}/api/v2/reimport-scan/" \
        -H "Authorization: Token ${DEFECTDOJO_API_KEY}" \
        -F "scan_date=$(date +%F)" \
        -F "minimum_severity=Medium" \
        -F "scan_type=Trivy Scan" \
        -F "active=true" \
        -F "verified=true" \
        -F "product_name=${CI_PROJECT_NAME}" \
        -F "engagement_name=${ENGAGEMENT_NAME}" \
        -F "engagement=${ENGAGEMENT_ID}" \
        -F "test_title=${TEST_TITLE}" \
        -F "auto_create_context=true" \
        -F "deduplication_on_engagement=true" \
        -F "close_old_findings=true" \
        -F "file=@trivy-results.json" \
        -w "\nHTTP Status: %{http_code}\n" \
        || ECHO_CURL_ERROR=$?
    - |
      if [ -n "$ECHO_CURL_ERROR" ]; then
        echo "❌ Failed to upload report (curl error code: $ECHO_CURL_ERROR)"
        exit 1
      fi
    - echo "✅ Upload completed"
  when: always
  artifacts:
    paths:
      - trivy-results.json